known_limitations:
  - "The tier column is not trustworthy alone (D004, D005). T3/T4 vetoes the quadrant; ignore the tier when the quadrant is CHEAP INSURANCE or DELETE."
  - "URL liveness is not price verification. Re-run reference/bom/recheck_prices.sh before the 2026-11-21 order-by date."
  - "The BOM CSV under-reports hours and contains an inline TOTAL row (D006)."
  - "The 90% back-test is against RAPD-REB archetypes, not BIOCORE. It measures reproduction of expert judgement on PAST seasons."
  - "Systemcore is the largest unquantified risk: 2027 is the first season without the roboRIO since 2015 and the ~40 h port inflation is [S]."
  - "Gate G2 novel_mechanisms_max=2 causes all three back-test misses. It is the parameter most likely to be wrong."
  - "manuals/2026-27_BIOCORE/ is empty. No BIOCORE primary source exists yet; re-run the whole audit on 2027-01-09."
  - "34 of the 38 tools were not executed; their on-disk outputs were taken as given."
