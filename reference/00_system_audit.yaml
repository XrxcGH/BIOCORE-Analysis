rubric_stress_set:
  file: "scratchpad/stress.yaml (8 adversarial probes)"
  probes:
    - id: X1
      intent: "6-mechanism vision-dependent do-everything robot must land in the worst tier"
      ach: 6.0
      val: 95.2
      quadrant: TRAP
      tier: T4 GATED
      result: PASS
    - id: X2
      intent: "trivial robot must show low value"
      ach: 100.0
      val: 0.0
      quadrant: CHEAP INSURANCE
      tier: T2 STRETCH
      result: PARTIAL
      note: "value axis correct and quadrant correct, but the tier label is misleading -- defect D004"
    - id: X3
      intent: "ADVERSARY -- all 5s on every factor, impossible gate inputs; can the gates be gamed?"
      ach: 100.0
      val: 100.0
      tier: T4 GATED
      result: PASS
      note: "gates evaluate independently of the weighted means; optimistic scoring cannot buy past a gate"
    - id: X4
      intent: "upper bound -- perfect and legal"
      ach: 100.0
      val: 100.0
      tier: T1 GREEN
      result: PASS
      note: "exactly 100.0 on both axes proves weight normalisation is correct"
    - id: X5
      intent: "single achievability zero must cap tier at T2"
      tier: T2 STRETCH
      result: PASS
    - id: X6
      intent: "two achievability zeros must cap tier at T3"
      quadrant: BUILD THIS
      tier: T3 RED
      result: PARTIAL
      note: "cap works, but quadrant and tier now contradict each other -- defect D005"
    - id: X7
      intent: "malformed input -- A1=9 out of range, A13 missing, no gates_input"
      result: FAIL_THEN_FIXED
      note: "scored silently AND skipped every hard gate; defect D001, fixed"
    - id: X8
      intent: "A4=0 must NOT cap (A4 is excluded, it has gate G6)"
      tier: T1 GREEN
      result: PASS

weight_sums:
  achievability: {factors: 13, raw_sum: 856, normalised: true, formula: "100 * sum(w_i*s_i) / (5*sum(w_i))"}
  value:         {factors: 5,  raw_sum: 290, normalised: true, formula: "100 * sum(v_j*t_j) / (5*sum(v_j))"}
  combined: "0.55*ACH + 0.45*VAL"
  verified_by: "X4 probe returns exactly 100.0/100.0"
  evidence: C

defects:
  - id: D001
    severity: high
    area: tools/score-strategy.py
    title: "Malformed candidate files scored silently; absent gates_input skipped EVERY hard gate"
    detail: "c.get('gates_input', {}) defaults to an empty dict and run_gates({}) fires nothing, so a
             candidate file missing that block printed a plausible tier with the entire gate system
             disabled. Out-of-range factor scores and missing factors were also accepted in silence."
    status: FIXED
    fix: "_validate_candidate() added; warns to stderr on missing factors, unknown keys,
          out-of-range scores, and absent gates_input. No score changes."
    regression: "--from-corpus still 27/30 = 90%; candidates_example.yaml unchanged"
    evidence: C
  - id: D002
    severity: medium
    area: reference/awards/award_alignment_matrix.yaml
    title: "Stale note asserting reference/team_capacity.yaml does not exist"
    detail: "The note predated the creation of team_capacity.yaml and was never revised. It marked the
             canonical capacity source as UNVERIFIED."
    status: FIXED
    fix: "Note corrected in place; 853.7 -> 854 rounding relationship stated so it is not re-opened."
    evidence: C
  - id: D003
    severity: low
    area: reference/bom/parts_manipulation.yaml
    title: "VEX flex-wheels page recorded as HTTP 403 (bot-blocked) when it is now HTTP 404 (gone)"
    detail: "403 means retry with a better UA; 404 means the part page no longer exists. The wrong
             status would have sent someone chasing a dead page before the Nov order-by date."
    status: FIXED
    fix: "price_note updated to record both statuses; explicitly labelled UNVERIFIED."
    evidence: C
  - id: D004
    severity: low
    area: reference/achievability_rubric.yaml (tier formula)
    title: "A zero-value robot reports tier T2 STRETCH"
    detail: "Tiers are banded on the combined index, which mixes VALUE into an achievability-flavoured
             label. 0.55*100 + 0.45*0 = 55, landing in the T2 band by arithmetic accident. T2 is
             defined as 'possible only if you buy an enabler' -- a robot that does nothing needs none."
    status: RECORDED_NOT_PATCHED
    reason: "Changing the tier formula would invalidate the 90% back-test four months before kickoff."
    operating_rule: "When the quadrant is CHEAP INSURANCE or DELETE, the tier column is meaningless."
    evidence: C
  - id: D005
    severity: medium
    area: reference/achievability_rubric.yaml (no_zeros_in_green)
    title: "Quadrant and tier can give opposite instructions on the same row"
    detail: "The no_zeros_in_green rule caps the TIER but not the QUADRANT, so probe X6 prints
             quadrant=BUILD THIS alongside tier=T3 RED ('do not build this')."
    status: RECORDED_NOT_PATCHED
    reason: "Same back-test-stability reason as D004."
    operating_rule: "A T3 RED or T4 GATED tier always overrides the quadrant. Tier is the veto,
                     quadrant is the reason."
    evidence: C
  - id: D006
    severity: low
    area: tools/bom-builder.py --csv
    title: "CSV hours do not reconcile to the BUILD HOURS gate, and an inline TOTAL row double-counts"
    detail: "CSV hours column sums to 63.0 h (FABRICATED lines only) against a gate figure of 89.0 h --
             by design, since mechanism build_hours come from the catalog and the fabricated rows are
             illustrative detail. A naive sum(ext_price) over the file also yields 8923.56 rather than
             4461.78 because the TOTAL row is inline with the item rows."
    status: RECORDED_NOT_PATCHED
    operating_rule: "Filter mechanism_id != 'TOTAL'; do not re-derive hour gates from the CSV."
    evidence: C

