# 05_rubric_backtest.yaml
# Machine-readable companion to reference/05_RUBRIC_BACKTEST.md
#
# The validation record for reference/achievability_rubric.yaml: full scored
# results for all 30 archetypes, the v1 -> v2 tuning changelog, the hit rate and
# every miss, the independent TBA test, the uncertainty register, and the
# regression assertions to re-run after ANY future edit to the rubric.
#
# Written 2026-08-22. Nothing in this file describes BIOCORE. BIOCORE is FRC,
# kickoff 2027-01-09 12:00 ET, and its game is not public as of 2026-08-22.
# See research/00_PREMISE_CORRECTION.md.
#
# evidence: C = confirmed in a primary source in this corpus (manual text or
#               scraped TBA data)
#           H = historical pattern across prior FRC seasons
#           S = speculation / model calibration
#           U = unverified

meta:
  version: 1
  written: 2026-08-22
  companion_md: reference/05_RUBRIC_BACKTEST.md
  instrument_under_test: reference/achievability_rubric.yaml
  instrument_version_before: 1
  instrument_version_after: 2
  test_set: reference/archetype_corpus.yaml        # 30 archetypes, 2022-2026
  scorer: tools/score-strategy.py
  independent_test: tools/backtest_specialists.py
  team_profile: "~15 students, 1 experienced technical mentor, COTS path, $2,500 robot discretionary"
  machine_run_on: 2026-08-22
  deterministic: true
  network_used: false

