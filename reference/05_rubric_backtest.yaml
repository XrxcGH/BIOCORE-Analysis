headline:
  agreement_v2: {hits: 27, total: 30, pct: 90}
  agreement_v1: {hits: 24, total: 30, pct: 80}
  baseline_arch_own_predicate: {hits: 21, total: 30, pct: 70}
  false_green_count: 0            # THE safety property: no T1 GREEN row is anything but hand-YES
  false_green_denominator: 12
  false_gate_count: 3
  spearman_ach_vs_hand_verdict: -0.709     # load-bearing
  spearman_val_vs_outcome: -0.899          # PARTLY CIRCULAR -- see uncertainty U4
  confusion_matrix_monotone: true
  agreement_mapping:
    YES: [T1 GREEN, T2 STRETCH]
    CONDITIONAL: [T2 STRETCH, T3 RED]
    MARGINAL: [T2 STRETCH, T3 RED]
    NO: [T3 RED, T4 GATED]
  interpretation: >
    In-sample consistency, not out-of-sample accuracy. The rubric's anchors were
    calibrated against this same 30-record set and this pass tuned three gate
    parameters against it. 27/30 is a floor on internal consistency. The honest
    out-of-sample test is 2027: score candidates on kickoff day, seal the file,
    compare in April.

