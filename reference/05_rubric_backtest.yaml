# ===================================================== THE MISSES
misses_v2:
  count: 3
  single_root_cause: true
  root_cause: >
    The corpus auto-scorer maps novel_mechanisms := mechanism_count, but
    archetype_corpus.yaml defines mechanism_count as "powered subsystems BEYOND
    the drivetrain" -- NOT "subsystems this team must invent". Gate G2's constant
    (novel_mechanisms_max = 2, derived four independent ways in the capacity model
    sec 5.2 and 6.3) is correct; its INPUT is wrong. This is a missing factor, not
    a bad weight and not a bad anchor.
  records:
    - id: C1
      season: 2024
      name: SPEAKER Cycler (variable distance)
      hand: CONDITIONAL
      rubric: T4 GATED
      fired: "G2 WORKSTREAMS: 3 novel mechanisms > novel_mechanisms_max 2"
      diagnosis: "By 2024 the intake and flywheel had released copyable precedents; only the variable-range aim stack was genuinely novel. True novel count is ~2, not 3."
      fix_class: missing_factor
    - id: P1
      season: 2022
      name: UPPER HUB Cycler
      hand: CONDITIONAL
      rubric: T4 GATED
      fired: "G2 WORKSTREAMS: 3 novel mechanisms > novel_mechanisms_max 2"
      diagnosis: same as C1
      fix_class: missing_factor
    - id: R7
      season: 2026
      name: Depot Cycler / Lift Dumper
      hand: MARGINAL
      rubric: T4 GATED
      fired: "G2 WORKSTREAMS: 3 novel mechanisms > novel_mechanisms_max 2"
      diagnosis: same as C1
      fix_class: missing_factor
  why_not_fixed_this_pass: >
    The correct fix needs a per-mechanism cots_status field that
    archetype_corpus.yaml does not have -- the same gap the rubric's own
    limitations already confess for A10. Fabricating that field for 30 records to
    move 27 to 30 would be tuning the test set, not the instrument.
  does_not_occur_on_real_candidates: >
    A human scoring a real design against ACHIEVABILITY-RUBRIC.md sec 2 A2's
    five-part tie-break already answers the COTS question. This miss is an
    artefact of the auto-scorer, which the rubric labels "a regression-test
    harness, not a scoring method".

misses_v1_fixed_by_the_tune:
  - {id: G1, hand: YES,         v1: T4 GATED, v2: T2 STRETCH, cause: "router treated as a hard capability wall"}
  - {id: F4, hand: CONDITIONAL, v1: T4 GATED, v2: T3 RED,     cause: "router treated as a hard capability wall"}
  - {id: C4, hand: CONDITIONAL, v1: T4 GATED, v2: T3 RED,     cause: "router treated as a hard capability wall"}

# ===================================================== THE TUNE (v1 -> v2)
tuning_changelog:
  target_file: reference/achievability_rubric.yaml
  backup_v1: reference/.achievability_rubric.v1.bak
  weights_changed: 0             # deliberately. No weight, threshold, anchor or
                                 # quadrant/tier cut was touched.
  changes:
    - id: A
      key: gates.checks[G1].grading
      before: "absent -- manufacturing floor was a binary in/out of owned_manufacturing"
      after: "hard_floors: [CNC]; soft_floors: [router]; soft effect = one-tier downgrade"
      principle: >
        A gate must distinguish a machine that cannot be bought as a service from
        one that can. In-house CNC mill/lathe on a load-bearing part is the former;
        2D profile cutting is the latter.
      implements: "archetype_corpus.yaml's own stated fix: 'make mfg_floor a graded term rather than a binary'"
      evidence: S
      revert: "soft_floors: []"
      records_moved: [G1, F4, C4]
    - id: B
      key: gates.checks[G4].soft_band_multiplier
      before: "absent (effectively 1.0) -- hard gate at >205 h"
      after: 1.25                # hard above 256 h; soft between 205 and 256 h
      principle: >
        A hard gate must not fire inside its own input's error bar. The capacity
        model calls hours_per_novel_mechanism = 90 "deliberately generous" and
        archetype_corpus states its effort/cost bands are +/-40%. 205 < est <= 256 h
        is not "unbuildable", it is "needs an enabler bought" = T2 STRETCH.
      evidence: S
      revert: "soft_band_multiplier: 1.0"
      records_moved: [G1, F4, C4]
    - id: C
      key: gates.soft_downgrade_max_tiers
      before: "absent (unbounded stacking)"
      after: 1
      principle: >
        T2 STRETCH already MEANS "possible only if you buy a specific named
        enabler". Two soft flags = two enablers, still STRETCH. Stacking to T3 RED
        asserts un-buildability, which is what a HARD gate is for.
      evidence: S
      revert: "soft_downgrade_max_tiers: 99"
      records_moved: [G1]        # only bites in combination with A and B
    - id: D
      key: meta.version / meta.tuned / meta.tuning_record
      before: "version: 1"
      after: "version: 2, tuned: 2026-08-22, tuning_record: reference/05_RUBRIC_BACKTEST.md"
      principle: provenance
      evidence: C

scorer_patch:
  file: tools/score-strategy.py
  backup: tools/.score-strategy.py.pretune.bak
  reason: "new YAML keys need code that reads them"
  backwards_compatible: true
  compatibility_verified: "patched scorer + UNMODIFIED v1 yaml reproduces agreement 24/30 and an identical 30-row table"
  changes:
    - "run_gates() returns (hard_gates, soft_gates) instead of (hard_gates, bool)"
    - "run_gates() reads G1.grading.soft_floors, default [] -> v1 behaviour"
    - "run_gates() reads G4.soft_band_multiplier, default 1.0 -> v1 behaviour"
    - "G6 DRIVE_HOURS became an entry in the same soft-gate list"
    - "evaluate() applies min(len(softs), gates.soft_downgrade_max_tiers) downgrades, default cap 99 -> v1 behaviour"
    - "print_detail() prints every soft gate with its reason instead of a hardcoded G6 line"
    - "binding-constraint string: '[+G6 drive-hours]' -> '[soft G1,G4,G6]'"

before_after:
  agreement:      {v1: "24/30 = 80%", v2: "27/30 = 90%", delta: "+3"}
  false_green:    {v1: "0/12", v2: "0/12", delta: "unchanged -- the safety property held"}
  rows_changing_tier: 6
  distinct_root_causes_among_misses: {v1: 1, v2: 1}
  re_diagnosis_value: >
    C1, P1 and R7 are still misses, but v1 said "you need a machine you do not own"
    (relaxable with money, capacity constraint #5 of 5) and v2 says "you need more
    unsupervised student leads than you have" (constraint #2, in-season elasticity
    None). The second statement is the true one, and it is the one that changes
    what the team does in the fall.

sensitivity_outsourced_2d_account:
  command: "python tools/score-strategy.py --from-corpus reference/archetype_corpus.yaml --set outsourced_2d_account=true"
  agreement: "27/30 = 90%"
  misses: [C1, P1, R7]
  finding: >
    Unchanged, and stronger than in v1. The router grading has already absorbed the
    machine question, so buying the fabrication account moves nothing at all: the
    surviving blocker was never money. The rubric independently reproduces capacity
    model sec 7.1's constraint hierarchy -- mentor attention #1, unsupervised leads
    #2, effective hours #3, machines #4, money #5.

# ============================== INDEPENDENT TEST (never fitted to anything)
independent_tba_test:
  evidence: C
  script: tools/backtest_specialists.py
  source: research/predictive_tba/tba_{copr,alliances}_{2023..2026}.csv
  question: >
    Among teams whose TOTAL component-OPR is below the event median, does being
    top-quartile in ABSOLUTE auto or endgame COPR raise the alliance-selection
    rate? If yes, the rubric's top-ranked archetype families (I5 AUTO Specialist,
    I4 Endgame Specialist) are supported by data nobody in this project labelled.
  method_note: "ABSOLUTE component COPR, not share of total. A team with total 10 and auto 5 is a small robot, not an auto specialist."
  results:
    2023: {n_below_median: 3566, base_pick_pct: 32.9, hi_auto_pct: 53.5, hi_auto_n: 99,  hi_endgame_pct: 43.2, hi_endgame_n: 475, neither_pct: 30.7}
    2024: {n_below_median: 3763, base_pick_pct: 30.7, hi_auto_pct: 45.5, hi_auto_n: 110, hi_endgame_pct: 45.4, hi_endgame_n: 425, neither_pct: 28.5}
    2025: {n_below_median: 3960, base_pick_pct: 31.8, hi_auto_pct: 54.7, hi_auto_n: 150, hi_endgame_pct: 55.7, hi_endgame_n: 366, neither_pct: 28.6}
    2026: null                   # see caveat_2026_missing
  reading: "1.4-1.7x lift in pick rate, every season measured, for both specialisms."
  supports_rubric_rows:
    I5_auto_specialist: [C5, P5, R5, F5]     # the four highest combined indices in the file
    I4_endgame_specialist: [G3, R4]
  caveat_2026_missing: >
    tba_copr_2026.csv has empty auto/teleop/endgame columns for all 8,160
    team-events, because TBA's 2026 score-breakdown keys differ from 2023-2025.
    The test therefore covers three seasons and NOT the corpus's primary
    calibration season. Fix: re-run tools/tba_copr_scrape.py with the REBUILT keys
    mapped. Cost: under an hour.
  other_caveats:
    - "component COPR cannot distinguish deliberate specialisation from a robot that only managed the auto"
    - "being picked is not the same as being useful, though PF treats pct_picked as the terminal outcome"
    - "selection effects: teams good at auto may be good in ways total COPR under-measures"
    - "suggestive evidence, not a causal claim"

base_rates_context:
  evidence: C
  source: archetype_corpus.yaml base_rates (derived from research/predictive_tba/)
  winning_alliances_with_a_below_median_opr_member_pct: {2023: 64, 2024: 69, 2025: 68, 2026: 78}
  rank1_seeds_with_a_below_median_opr_member_pct: {2023: 71, 2024: 68, 2025: 71, 2026: 81}
  reading: >
    The second- and third-pick slots that the rubric's T1 GREEN population targets
    are the statistically normal route onto a winning alliance for this team
    profile, not a consolation prize. Upper bound: OPR percentile cannot tell a
    deliberate support robot from a broken one.

# ===================================================== UNCERTAINTY REGISTER
uncertainties:
  - id: U1
    title: novel-mechanism counting (C1 / P1 / R7)
    status: LIVE -- causes all three residual misses
    question: "Is a 3-mechanism design 3 novel workstreams, or 2 novel + 1 copied?"
    resolved_by: >
      Add a per-mechanism cots_status field [released_design | vendor_kit | bespoke]
      to all 30 archetype_corpus.yaml records and set
      novel_mechanisms = count(bespoke). Sources already on disk: the five manuals
      plus reference/bom/06_MECHANISM_CATALOG.md.
    cost: "~2 hours, before kickoff, not on kickoff day"
    falsifier: "if agreement does NOT reach 30/30 after the fix, G2's constant is the thing to question, not its input"
    evidence: S
  - id: U2
    title: F4 and C4 at T3 RED -- over-correction or correct caution?
    status: OPEN, no evidence available to choose
    question: >
      Both are I4 endgame designs that reached second-pick, sitting at indices 56.0
      and 55.5 -- inside the STRETCH band, pushed to T3 RED by one soft downgrade.
      I4 is otherwise 6/6.
    resolved_by:
      - "how many PARTS actually need the router floor (A9 tie-break: one router part is a purchase order, eight is a fabrication programme); neither corpus record states a part count"
      - "whether soft downgrades should apply below the T1 boundary at all -- a defensible v3 change is to restrict them to T1->T2"
    not_changed_this_pass_because: "it moves nothing on the current test set, so there is no evidence to choose it"
    evidence: S
  - id: U3
    title: the AUTO specialists' A7 = 0 under SystemCore
    status: LARGEST SINGLE SOURCE OF VARIANCE
    question: >
      C5, P5 and F5 are held at T2 STRETCH solely by the no-zeros rule firing on
      A7 = 0/5, produced by the systemcore_adjustment table. If SystemCore + WPILib
      2027 turn out easier than the mature roboRIO stack for path-following autos,
      the rubric's four highest-index rows all turn T1 GREEN at once.
    resolved_by:
      - "has SystemCore hardware shipped to teams"
      - "does WPILib 2027 ship a working path-follower on SystemCore"
      - "is the roboRIO still legal in 2027 (UNVERIFIED as of 2026-08-22)"
    downside_case: "if SystemCore has not shipped at kickoff, A13 floors at 1 for everything that touches it -- these rows get WORSE, not better"
    evidence: "C that the control system changes; S on the direction of the difficulty delta"
  - id: U4
    title: the VALUE-axis correlation is partly circular
    status: KNOWN, disclose it rather than quote the number
    question: >
      rho = -0.899 between VALUE and corpus outcome looks like a triumph and is not
      one: the auto-scorer derives V3 alliance_selection_appeal and V5 ceiling
      DIRECTLY from the outcome field. Those two carry 120 of the 290 value weight
      = 41%.
    resolved_by:
      - "recompute rho using V1 only against outcome"
      - "re-derive V3 from TBA pick data rather than from the corpus label"
    partial_progress: "the independent_tba_test above is the first instalment of exactly that, and it holds -- but it tests the archetype FAMILY, not the per-record V3"
    use_instead: "spearman_ach_vs_hand_verdict = -0.709"
    evidence: S
  - id: U5
    title: 2026 REBUILT is absent from the only non-circular test
    status: OPEN, cheap to fix
    question: >
      The component-COPR test covers 2023-2025 only. 2026 is the corpus's
      primary_calibration_season and the manual archetype_corpus says BIOCORE most
      plausibly resembles -- so the season that matters most is the one missing
      from the independent test.
    resolved_by: "re-run tools/tba_copr_scrape.py with the 2026 REBUILT score-breakdown keys mapped; verify field names against manuals/archive/frc/_txt/2026_REBUILT.txt Table 6-4"
    cost: "under an hour"
    evidence: "C that the data are missing; S that the 2026 result would match"

# ===================================================== REGRESSION ASSERTIONS
# Run these after ANY future edit to achievability_rubric.yaml or score-strategy.py.
regression_assertions:
  - {id: R1, assert: "--from-corpus agreement >= 27/30",                                     current: "27/30",  pass: true}
  - {id: R2, assert: "false-GREEN count == 0 (no T1 GREEN row whose hand label is not YES)", current: "0/12",   pass: true}
  - {id: R3, assert: "all four NO records (F1, R1, G2, P3) are T3 RED or T4 GATED",          current: "4/4",    pass: true}
  - {id: R4, assert: "G2 (Full-Grid, I2 do-everything) has the LOWEST ACH in the file",      current: "14.9",   pass: true}
  - {id: R5, assert: "patched scorer + v1 yaml still reproduces exactly 24/30",              current: "24/30",  pass: true}
  - {id: R6, assert: "confusion matrix is monotone -- no off-diagonal cell >1 step off",     current: "monotone", pass: true}
  - {id: R7, assert: "ACH vs hand-verdict Spearman rho <= -0.65",                            current: -0.709,   pass: true}
