# 04_competition_ops.yaml
# Machine-readable companion to reference/team-ops/04_tuning_testing_competition_ops.md
#
# Evidence labels: C = CONFIRMED (primary source in this corpus), H = HISTORICAL-PATTERN,
#                  S = SPECULATION / model assumption, UNVERIFIED
# Every hours or dollars figure here must agree with reference/team_capacity.yaml.
# Nothing here is BIOCORE-specific: BIOCORE's rules are not public as of 2026-08-22.

meta:
  version: 1
  written: 2026-08-22
  companion_md: reference/team-ops/04_tuning_testing_competition_ops.md
  capacity_authority: reference/team_capacity.yaml
  bom_authority: reference/bom/03_LAUNCHERS_ELECTRONICS.md
  season: 2027 BIOCORE presented by Haas (FRC, FIRST CANOPY)
  kickoff: "2027-01-09T12:00:00-05:00"
  profile: "15 students, 15 scheduled h/wk, one experienced technical mentor, COTS path"

