      label: "Team Test Elements (formerly 'Team Elements' / 'Team Versions')"
      fidelity: low
      material: "lumber / hardware-store materials"
      tools: "common hand and power tools"
      evidence: C
    - id: event_test_elements
      label: "Event Test Elements"
      fidelity: low-to-medium
      material: "notch-and-tab plywood + some real field components"
      note: "manufactured by FIRST and used at official events"
      evidence: C
    - id: team_practice_elements
      label: "Team Practice Elements"
      fidelity: medium
      note: "starting point for a higher-fidelity practice area"
      evidence: C
    - id: wood_practice_perimeter
      label: "Wood Practice Perimeter"
      fidelity: medium
      note: "matches Team Practice Elements construction style"
      evidence: C
    - id: unofficial_for_sale
      label: "Unofficial FIELD Elements for Sale"
      vendors_2026: [AndyMark, WestCoast Products, The Thrifty Bot, REV Robotics, Swyft]
      warning: "FIRST cannot confirm these match the Official FIELD"
      evidence: C

  # 2026 REBUILT Team Test Element shopping lists, verbatim from the build-instruction PDFs. [C]
  # Held here as the SHAPE of what a 2027 element will cost, not as a 2027 claim.
  te_2026_shopping_lists:
    TE-26000_OUTPOST:
      lumber: ["2x4x8 lumber x6", "1x2x8 lumber x1", "4'x8'x1/2\" plywood x1"]
      hardware: ["#8 x 2.5\" wood screw x~54", "#8 x 1.5\" x~16", "#8 x 1\" x4",
                 "1/4-20 x 3.5\" bolt x2", "1/4-20 wing nut x2"]
      evidence: C
    TE-26100_BUMP:
      lumber: ["2x4x8 lumber x5", "4'x8'x1/2\" plywood x1"]
      hardware: ["#8 x 2.5\" wood screw x~60", "#8 x 1.5\" x~24"]
      evidence: C
    TE-26200_TRENCH:
      lumber: ["2x4x8 lumber x3", "4'x4'x1/2\" plywood x1"]
      hardware: ["#8 x 2.5\" wood screw x~30", "#8 x 1.5\" x~8"]
      evidence: C
    TE-26600_DEPOT:
      lumber: ["4'x4'x1/2\" plywood x1"]
      hardware: ["wood glue"]
      evidence: C
    TE-26300_HUB:
      note: "Version 2. Uses the same polycarbonate funnel panels as the real field (GE-26329);
             purchasable from AndyMark / Thrifty Bot / WCP / REV instead of fabricating."
