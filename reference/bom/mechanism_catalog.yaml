  - {vendor: CTR Electronics, item: "Pigeon 2.0 9-DOF IMU", sku: "21-737785", qty: 1, unit_price: 199.99, est_unit_price: null, url: "https://store.ctr-electronics.com/products/pigeon-2", verified: true}
  fabricated_parts:
  - {part: Frame rails 2x1 aluminum tube, material: 6061-T6 2x1x0.100 tube, process: cut + drill, machine_required: bandsaw_drillpress, qty: 4, est_hours: 4}
  - {part: Module mounting plates, material: 1/8 in 6061 sheet, process: drill from module template, machine_required: bandsaw_drillpress, qty: 4, est_hours: 6}
