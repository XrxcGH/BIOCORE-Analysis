# mechanism_catalog.yaml
# Machine-readable companion to reference/bom/06_MECHANISM_CATALOG.md
# Consumed by tools/bom-builder.py
#
# CONSOLIDATION NOTE: this file does NOT re-verify prices. It composes the already-verified
# part rows from the phase-1 files into buildable mechanism archetypes:
#     reference/bom/parts_drivetrain.yaml     (01_DRIVETRAIN.md)
#     reference/bom/parts_manipulation.yaml   (02_MANIPULATION_ELEVATION.md)
#     reference/bom/parts_electronics.yaml    (03_LAUNCHERS_ELECTRONICS.md)
# Every unit_price with verified: true was read off a LIVE vendor page on 2026-08-22 by
# that phase. Every line with verified: false carries unit_price: null and a separate
# est_unit_price planning figure -- an estimate is NEVER promoted into a price field.
#
# Evidence labels: C CONFIRMED | H HISTORICAL-PATTERN | S SPECULATION | UNVERIFIED
#
# DELIVERY ENVELOPES (added 2026-08-22 after the rehearsal grade, review/REHEARSAL_GRADE.md sec 5).
# Every mechanism that can put a game piece somewhere carries a `delivery:` block:
#
#     delivery:
#       mode: shoot | lift | dump | place | roll
#       min_height_in / max_height_in   vertical band this mechanism can deliver into, in inches
#                                       above the carpet
#       max_range_in                    horizontal standoff at which it can still deliver
#                                       (0 or small = contact range only)
#       provides_carrier: true          this is an elevation/arm that raises whatever rides on it
#       requires_carrier: true          this contributes ~no reach of its own (end effectors,
#                                       turrets, indexers); its height comes from a carrier
#       evidence: C | H | S | UNVERIFIED
#
# tools/bom-builder.py GATES a config against the `target:` block in the bom_config, and shouts
# if no target is declared. Mechanisms with game_piece_classes: [none] (drivetrain, electrical,
# climbers, vision) deliver nothing and carry no delivery block; the gate ignores them.
# The 2026 rehearsal costed a hopper dump (rim ~30 in) against a 72 in HUB lip and no tool
# objected. That is the defect these blocks exist to make impossible.
# Source shorthand: REB=2026 REBUILT, REEF=2025 REEFSCAPE, CRES=2024 CRESCENDO
#
# Hours (build/design/programming) are [S] planning figures calibrated against
# reference/02_TEAM_CAPACITY_MODEL.md sec 3.1 and reference/bom/02_MANIPULATION_ELEVATION.md sec 13.

meta:
  version: 1
  written: 2026-08-22
  companion_md: reference/bom/06_MECHANISM_CATALOG.md
  prices_inherited_from: 2026-08-22
  currency: USD
  season: 2027 BIOCORE presented by Haas (FRC, FIRST CANOPY)
  kickoff: "2027-01-09T12:00:00-05:00"
  team_profile: "~15 students, one experienced mentor, bandsaw+drill press, $2500 robot discretionary"
  control_system: "Systemcore replaces roboRIO for 2027; WPILib 2027 is Systemcore-only"
  price_volatility_warning: >
    FRC vendor prices moved mid-season in 2026. Run reference/bom/recheck_prices.sh before any
    purchase order. Treat every figure as +/-10% until re-verified the week of 2027-01-09.
  scoring_element_warning: >
    BIOCORE's scoring element name, geometry, and mass are NOT public as of 2026-08-22.
    Every game_piece_classes entry is a hypothesis set, not a claim about BIOCORE.
    Pollen / StarterBots / Skill Builders are FTC BIOBUZZ concepts and appear nowhere here.

tooling_ranks:
  hand_tools: 1
  bandsaw_drillpress: 2
  router_cnc: 3
  mill_lathe: 4
  outsourced: 5

game_piece_classes:
  - sphere_small          # <= 5 in dia, ~0.1-0.3 lb   (2022 CARGO class)
  - sphere_large          # > 7 in dia                  (2016 BOULDER class)
  - torus                 # ring / donut                (2023 CONE-and-CUBE era torus, 2025 CORAL-adjacent)
  - cylinder              # tube / pipe                 (2025 REEFSCAPE CORAL class)
  - cube_soft             # compliant cube              (2023 CUBE class)
  - disc_flat             # frisbee / plate             (2013 DISC class)
  - irregular             # non-canonical geometry
  - none                  # mechanism does not touch a game piece

# =========================================================================================
mechanisms:

# ------------------------------------------------------------------ DRIVETRAINS (4)
