  - {part: Corner gussets, material: 1/8 in 6061 angle, process: cut + drill, machine_required: bandsaw_drillpress, qty: 8, est_hours: 3}
  cots_cost_usd: 2345.19
  material_cost_usd: 260
  total_cost_usd: 2605.19
  tooling_floor: bandsaw_drillpress
  build_hours: 40
  design_hours: 22
  programming_hours: 45
  motors_required: 8
  controllers_required: 8
  sensors_required: [4x azimuth absolute encoder, 1x IMU, 8x integrated motor encoder]
  pneumatics_required: false
  lead_time_weeks: 4
  stockout_risk: high
  common_failure_modes:
  - Azimuth zero offsets lost after a module is disassembled; robot drives sideways.
  - Belt/gear backlash in azimuth causes hunting under closed-loop control.
  - CAN bus ID collisions across 8 controllers + 4 encoders; intermittent brownouts on the bus.
  - Set screws on drive shafts back out; one corner freewheels mid-match.
  - Odometry drift when a wheel slips; auto paths walk off target by Week 2.
