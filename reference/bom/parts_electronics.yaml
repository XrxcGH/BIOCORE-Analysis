# parts_electronics.yaml
# Companion to reference/bom/03_LAUNCHERS_ELECTRONICS.md
#
# Machine-readable parts table for BIOCORE (FRC 2027) electronics + launcher planning.
# Every price carries a `verified` boolean, the date it was read, and the source URL.
# Anything not read off a live vendor page on the verification date is verified: false
# with price: null -- NEVER an estimate. Per project accuracy policy: UNVERIFIED, not guessed.

meta:
  file: reference/bom/parts_electronics.yaml
  companion_md: reference/bom/03_LAUNCHERS_ELECTRONICS.md
  season_target: 2027 BIOCORE presented by Haas (FRC)
  kickoff: "2027-01-09T12:00:00-05:00"
  rules_source: manuals/archive/frc/2026_REBUILT_GameManual.pdf
  rules_text: research/rule_inventories/2026_rules_full.txt
  rules_season: 2026 REBUILT
  price_verification_date: "2026-08-22"
  currency: USD
  labels:
    C: CONFIRMED - quoted from the 2026 manual, or read from a live vendor page on price_verification_date
    H: HISTORICAL-PATTERN - recurs across seasons; not stated for BIOCORE
    S: SPECULATION - engineering inference or design judgement
    UNVERIFIED: not confirmed against a live source; do not buy against it
  warnings:
    - "All rule quotations are from the 2026 manual. 2027 replaces the roboRIO with Systemcore;
       R615, R701, R703, R711-R717 are guaranteed to change."
    - "Prices reprice at kickoff. Re-verify the week of 2027-01-09 before committing budget."
    - "Educational (FRC team) pricing shown where the vendor lists it; MSRP differs."

# ---------------------------------------------------------------------------
# 2027 CONTROL SYSTEM TRANSITION
# ---------------------------------------------------------------------------
systemcore:
  status: replaces_roborio_for_2027
  label: C
  confirmed:
    soc: Raspberry Pi Compute Module 5 (CM5)
    cpu: quad-core ARM Cortex-A76 (real-time Linux)
    ram_gb: 4
    gpu: VideoCore VII
    io_coprocessor: Raspberry Pi RP2350 for reconfigurable I/O
    size_note: "approximately the size of a large smartphone"
    ports:
      can_fd: 5           # Weidmuller wire-to-board
      smartio: 6          # 3-pin Molex-SL, flexible analog/digital in/out (PWM/DIO/AI)
      i2c: 2              # 4-pin Molex-SL
      usb3_a: 4
      usb_c_device: 1
      ethernet: 1
      power_input: 1      # Weidmuller wire-to-board
      rsl: 1              # 2-pin Molex-SL
      motioncore_bridge: 1  # 4-pin Molex Microfit+
    onboard:
      imu: true
      leds: true
      display: true
      wifi: "integrated 2.4GHz / 5GHz radio"
      m2_a_e_slot: "compatible with Hailo-8 AI accelerator"
    software:
      web_ui_vendor: Limelight
      web_ui_features: [device config, on-robot hosted coding (Blockly/Java/Python), live sensor values]
      driver_station: "2027 FIRST Driver Station - Systemcore only; roboRIO keeps the existing DS"
      ds_platforms: [Windows x64, Windows arm64, macOS x64, macOS arm64, Linux x64, Linux arm64]
      ds_fms_support: "FMS (At Event) support only on Windows and the hardware appliance"
      ds_gamepad: "16-bit resolution (was 8-bit), up to 64 buttons and 8 POVs"
      ds_logging: "WPILib log format, AdvantageScope-compatible"
      ds_min_display_width_px: 1280
      labview: "Emerson/NI LabVIEW support being explored - not committed"
    timeline:
      frc_alpha_start: "2025-06"
      frc_alpha_teams: 50
      ftc_alpha_start: "2025-09 (delayed by MotionCore design changes)"
      frc_season: 2027
      ftc_season: "2027-28"
  pricing:
    exact_price: null
    verified: false
    official_statement: "on target to meet our goal of offering Systemcore at a lower price than the roboRIO"
    statement_source: https://community.firstinspires.org/2025-control-system-testing-reminder-for-2027
    statement_date: "2025-10"
    label: C   # the STATEMENT is confirmed; the PRICE is not
  unverified_open_questions:
    - "Exact price to teams"
    - "KoP distribution: free to all teams? voucher? rookie vs veteran? (a claim that every team
       gets one in the 2027 year-specific KoP box circulates second-hand but was NOT confirmed
       from a primary FIRST source in this pass)"
    - "Whether the external VH-109 radio remains required given Systemcore's integrated WiFi"
    - "Whether the roboRIO remains legal as a fallback in 2027"
    - "Whether PWM motor controllers remain usable, and via which port (SmartIO is described as analog/digital)"
    - "Servo support and the fate of R506 / R712"
    - "Fate of MXP and the R713 approved-active-device list (navX MXP, RIOduino, Digit Board, Spartan, HUSKIE 2.0)"
    - "Systemcore built-in IMU noise/drift spec vs Pigeon 2.0"
    - "Whether WPILib ships a supported Hailo-8 vision pipeline for 2027"
  blocking_event:
    name: Pre-Kickoff Virtual Kit Release
    date: "2026-11-12"
    label: S   # date per project brief; confirm on firstinspires.org calendar
    action: "Watch live. Update this file the same day. This is when price, KoP contents, and the radio question resolve."
  preseason_actions:
    - "Do NOT buy a roboRIO 2.0"
    - "Do NOT buy a CANivore (Systemcore has 5 native CAN-FD ports)"
    - "Track github.com/wpilibsuite/SystemcoreTesting and the WPILib 2027 beta docs"
    - "Budget 2x normal offseason software time for the port"
    - "Hold $300-500 unallocated for control-system surprises"

