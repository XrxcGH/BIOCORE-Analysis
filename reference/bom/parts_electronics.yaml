# ---------------------------------------------------------------------------
# LAUNCHER DECISION SUPPORT (all [S] -- BIOCORE scoring element is not public)
# ---------------------------------------------------------------------------
launchers:
  label: S
  scope_warning: "BIOCORE's scoring element name/specs are NOT public. Pollen / StarterBots /
                  Skill Builders are FTC BIOBUZZ items and must never be attributed to BIOCORE.
                  Nothing here predicts that BIOCORE rewards launching."
  historical_base_rate:
    label: H
    projectile_seasons: [2026 REBUILT, 2024 CRESCENDO, 2022 RAPID REACT, "2020/21 INFINITE RECHARGE", 2017 STEAMWORKS, 2016 STRONGHOLD]
    non_projectile_seasons: [2025 REEFSCAPE, 2023 CHARGED UP, 2019 DEEP SPACE]
    summary: "~5-6 of the last 10 seasons rewarded a launcher. A coin flip, not a certainty."
  physics:
    stored_energy: "E = 0.5 * I * omega^2"
    droop_per_shot: "delta_omega / omega = delta_E / (2 * E)"
    recovery_time: "t ~= delta_E / P_available"
    power_cap_note: "R621 Table 8-3 caps a motor-controller branch at a 40A breaker => ~480W electrical, ~330-380W mechanical"
    inertia_rule_of_thumb: "flywheel stored energy should be 5-10x the per-shot energy transfer to keep droop under 10%"
    gear_ratio_rule_of_thumb: "size the ratio so the flywheel runs at 60-80% of motor free speed at the shot setpoint"
    surface_speed_4in_at_6000rpm_mps: 31.9
    single_flywheel_ball_speed: "~1/2 wheel surface speed, with free backspin"
    dual_flywheel_ball_speed: "~full wheel surface speed; spin proportional to (omega1 - omega2)"
  architecture_recommendations:
    small_team_default: "single flywheel + FIXED hood + variable RPM lookup table, one shooting spot"
    upgrade_path: "variable hood only after the fixed-spot version already works and is being defended"
    turret: "SKIP in weeks 1-4. Aim with the drivetrain. R623 permits COTS slip rings but a +/-200 deg wrap limit covers every real case."
    feeder_gate: "gate the feeder on STABLE velocity, not on reached velocity - the single highest-value line of shooter code"
  alternatives:
    catapult: {energy: "elastic deformation, legal per R608-C", pro: "huge instantaneous power, no droop", con: "fixed range, slow re-cock, violent", fit: "big close forgiving goal"}
    pneumatic_puncher: {energy: "compressed air, R608-A, <=60 psi working per R808", pro: "instant, repeatable", con: "air is a finite budget", fit: "<=10 shots per match"}
    linear_launcher: {energy: motor, pro: "precise, variable energy", con: "low power density, long stroke, slow reset", fit: "rarely competitive in FRC"}
