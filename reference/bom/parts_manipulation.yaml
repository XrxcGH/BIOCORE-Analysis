    evidence: H

# ---------------------------------------------------------------------------------
# Sec 12 -- 3D printing
# ---------------------------------------------------------------------------------
printing:
  evidence: H
  materials:
    pla_plus:  {ok_for: ["prototypes","sensor brackets","wire guides","templates"], fails_at: ["heat near motors","impact"], never: ["load path","near a motor"]}
    petg:      {ok_for: ["funnels","chutes","hoppers","ball guides","light covers"], fails_at: ["Z layer adhesion in tension","creep under sustained load"], never: ["pivots","spring-loaded parts"]}
    abs_asa:   {ok_for: ["motor shrouds"], fails_at: ["warping without an enclosure"], never: ["fine detail"]}
    nylon:     {ok_for: ["living hinges","wear surfaces","gripper pads"], fails_at: ["moisture absorption","printing difficulty"], never: ["dimensional precision parts"]}
    nylon_cf:  {ok_for: ["gears","pulleys","sprockets","roller cores","gripper jaws","structural brackets"], fails_at: ["cost","needs hardened nozzle + dry filament"], never: ["replacing a machined pivot in the main load path"], verdict: "best general-purpose FRC filament"}
    onyx:      {ok_for: ["structural brackets if a sponsor prints them"], fails_at: ["proprietary machine + filament","slow","expensive"], never: ["anything you need in 24 hours"]}
    tpu:       {ok_for: ["intake grip surfaces","bumper corner pads","cable strain relief"], fails_at: ["no stiffness"], never: ["structure"]}
  competition_failure_modes:
    - "heat creep near a motor -- a PLA bracket 2 in. from a hard-working motor deforms on Saturday, not Thursday"
    - "layer separation in tension -- orient every part so the primary load is in-plane, never peeling layers"
    - "threads tapped into plastic strip -- use heat-set brass inserts or a through-bolt and nut"
  rule: "print fixtures, guides, prototypes and enclosures; machine or buy anything in the load path"

# ---------------------------------------------------------------------------------
# Sec 14 -- SAFETY. Stored energy is the top school-shop injury risk.
# ---------------------------------------------------------------------------------
safety:
  headline: "Elevators and springs store enough energy to break fingers and put fragments in eyes."
  constant_force_springs:
    hazard: "hardened steel strip under permanent tension; sharp edges; uncoils violently if it slips its spool"
    example_energy: "TTB kit spring = 16.5 lb over 50 in. of travel"
    rules:
      - "safety glasses on EVERYONE within reach, including observers"
      - "never uncoil by hand and let go; retain the free end mechanically at all times"
      - "install with the spool captured in its bracket, never free-standing"
      - "gloves for handling the strip"
      - "one person installs, one supervises -- never a lone student"
      - "never cut, drill, grind or heat a constant-force spring -- it is hardened and will shatter"
      - "a kinked or set spring is scrap; do not straighten and reuse"
      - "store spares coiled, in packaging, in a labelled box"
  elevators:
    rules:
      - "physically block the carriage before working on it -- a wooden block or hard-stop pin, not hands"
      - "a counterbalanced carriage can move UP as well as down when the drive is disengaged"
      - "disconnect the battery and vent all pneumatic pressure before reaching into the travel path"
      - "never put a hand between the carriage and a hard stop with the robot enabled"
      - "guard or tape-mark the sprocket/chain nips and the top pulley -- amputation-class hazards"
      - "first power-on: elevator at the bottom, current limit low, everyone behind the drive team"
      - "soft limits and a homing routine must exist BEFORE the first full-speed run"
      - "brake mode is NOT a safety device and does nothing when disabled"
  climbers_and_stored_pressure:
    rules:
      - "a charged gas spring is a pressure vessel -- never cut, puncture, heat, disassemble or bin it"
      - "a robot hanging from a climber is a suspended load -- nobody underneath, ever, including in the pit"
      - "vent pneumatics to zero and confirm at the gauge before disconnecting any line"
      - "Dyneema under tension cuts -- never run a hand along a loaded rope or use rope as a handle"
  shop_practice:
    - "safety glasses in the shop, always"
    - "no loose hair, sleeves or lanyards near rollers or sprockets"
    - "nobody operates a power tool alone or without a training sign-off"
    - "announce a powered test out loud before it runs"
    - "a mechanism that surprised you once gets guarded before it runs again"

