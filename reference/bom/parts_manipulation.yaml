  elevator_warning:
    headline: "Elevators are the classic small-team schedule killer"
    reasons:
      - "unforgiving of squareness -- tooling floor is a chop saw or band saw with a fence, not a drill press"
      - "chain and Dyneema both need retensioning after the first few dozen cycles -- unscheduled sessions"
