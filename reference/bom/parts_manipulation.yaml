# ---------------------------------------------------------------------------------
# Sec 7.2 -- rigging physics. Define by BEHAVIOUR, not by vendor vocabulary.
# ---------------------------------------------------------------------------------
elevator_rigging:
  invariant: "T * v_drum = W * v_carriage  (energy conservation, frictionless)"
  cascade:
    behaviour: "all stages move simultaneously and proportionally"
    carriage_speed: "N * v_drum"
    total_travel: "N * s"
    rope_tension: "N * W"
    drum_torque: "N * W * r"
    consequence: "N times faster, N times the torque; rope stretch and backlash also multiply by N"
  sequential_continuous:
    behaviour: "stages extend one after another"
    carriage_speed: "v_drum"
    total_travel: "N * s"
    rope_tension: "W"
    drum_torque: "W * r"
    consequence: "1/N torque, 1/N speed; mechanical hand-off clunk at each stage; CG rises in steps"
  terminology_caution:
    evidence: S
    text: >-
      Some vendors use "continuous rigging" to mean a single continuous rope loop that drives the
      carriage positively in BOTH directions, as opposed to gravity return. That is a different axis.
      When reading a vendor page ask two separate questions: (1) do stages move together or in
      sequence? (2) is the down-stroke driven or gravity-fed? The physics above depends only on (1).
  sizing_rule:
    text: "size the gear ratio so the required drum torque is <= 40% of available stall torque; elevators are sized by HOLDING and ACCELERATION, not steady-state lift"
    evidence: H
  motor_specs_prior_seasons:
    evidence: H
    warning: "UNVERIFIED for 2027. The 2027 legal motor list is published in the BIOCORE manual on 2027-01-09. Systemcore changes the controller side. Re-verify every number before calculating."
    nominal:
      kraken_x60:  {stall_nm: 7.09, free_rpm: 6000}
      falcon_500:  {stall_nm: 4.69, free_rpm: 6380}
      neo_vortex:  {stall_nm: 3.60, free_rpm: 6784}
      neo_1_1:     {stall_nm: 2.60, free_rpm: 5676}
      cim:         {stall_nm: 2.41, free_rpm: 5330}

# ---------------------------------------------------------------------------------
# Sec 9 -- articulation topologies
# ---------------------------------------------------------------------------------
articulation:
  single_jointed_arm:  {relative_cost: 1.0,  use_when: "two or three discrete heights; end-effector angle may vary", avoid_when: "piece must stay level", evidence: H}
  virtual_four_bar:    {relative_cost: 1.2,  use_when: "single-jointed arm PLUS a level end effector; 1:1 belt from a fixed ground pulley to the wrist", avoid_when: "wrist must be independently controlled", small_team_rank: 1, evidence: H}
  true_four_bar:       {relative_cost: 1.6,  use_when: "end effector translates along an arc staying level; load split over two links", avoid_when: "space is tight -- big swept envelope", evidence: H}
  double_jointed_arm:  {relative_cost: 3.0,  use_when: "must reach OVER an obstacle, or one mechanism serves floor pickup and high score", avoid_when: "you have not written inverse kinematics before", software_risk: high, evidence: H}
  elevator_plus_wrist: {relative_cost: 2.5,  use_when: "score locations at very different heights directly above the robot", avoid_when: "horizontal reach matters more than vertical", evidence: H}
  small_team_ordering: ["virtual_four_bar","single_jointed_arm","elevator_plus_wrist","true_four_bar","double_jointed_arm"]

