    - {mechanism: "Double-jointed arm",                  design: 20, build: 24, debug: 36, total: 80,  risk: very_high}
    - {mechanism: "Elevator, 1 stage, COTS kit",         design: 10, build: 22, debug: 20, total: 52,  risk: high}
    - {mechanism: "Elevator, 2 stage, COTS kit",         design: 14, build: 32, debug: 28, total: 74,  risk: very_high}
