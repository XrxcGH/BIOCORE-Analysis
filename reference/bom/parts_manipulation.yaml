# parts_manipulation.yaml -- machine-readable companion to 02_MANIPULATION_ELEVATION.md
#
# COTS parts for game-piece manipulation (intake / indexing / grippers) and for
# elevation & articulation (elevators / arms / climbers) on an FRC robot.
# Target consumer: a 15-student team building for BIOCORE presented by Haas (FRC 2027).
#
# EVERY price marked `evidence: C` was read off the live vendor page listed in `source`
# on 2026-08-22. Nothing here is invented. Where a price could not be fetched the row
# carries `price_usd: null` and `evidence: UNVERIFIED` -- it is NOT filled in from memory.
#
# RE-VERIFY (see 02_MANIPULATION_ELEVATION.md Sec 15):
#   python -c "import yaml;d=yaml.safe_load(open('parts_manipulation.yaml'));\
#     print(sum(len(v) for v in d['parts'].values()),'rows')"
#   then open every `source` URL and diff the price. >10% drift == this file is stale.
#
# SCHEMA (one mapping per part)
#   name          vendor's product string, as displayed
#   vendor        AM | WCP | TTB | REV | VEX | CTRE | MMC | igus
#   sku           vendor part number, or null if the page did not publish one
#   price_usd     number, or {from: n} for "from $n", or null
#   price_note    free text qualifying the number
#   spec          mapping of whatever the page stated (diameter, durometer, travel, ...)
#   game_piece_class  list of a|b|c|d|e from Sec 1, or "any"
#   role          intake_roller | roller_surface | transmission | elevator_kit |
#                 elevator_component | linear_motion | pivot | counterbalance |
#                 climber | gripper | printing
#   evidence      C | H | S | UNVERIFIED
#   source        URL fetched, or null

meta:
  title: "Manipulation & Elevation COTS parts"
  companion_md: "02_MANIPULATION_ELEVATION.md"
  season: "2026-27"
  game: "BIOCORE presented by Haas"
  program: "FIRST Robotics Competition (FRC)"
  kickoff: "2027-01-09T12:00:00-05:00"
  built: "2026-08-22"
  prices_verified_on: "2026-08-22"
  currency: USD
  scope_guard: >-
    BIOCORE is FRC. Nothing here draws on FTC BIOBUZZ. "Pollen", StarterBots and Skill
    Builders are FTC BIOBUZZ concepts and appear nowhere in this file. BIOCORE's scoring
    element name and specifications are NOT public as of 2026-08-22, so manipulation is
    organised by game-piece CLASS, not by a specific piece.
  control_system_note: >-
    2027 replaces the roboRIO with Systemcore. Nothing in this file is Systemcore-dependent
    (rollers and elevators are mechanical) but motor-controller count, CAN topology and the
    2027 legal motor list all live downstream of it. See reference/team-ops/03_programming_stack.md.
  sibling_files:
    drivetrain: ["01_DRIVETRAIN.md", "parts_drivetrain.yaml"]
    launchers_electronics: ["03_LAUNCHERS_ELECTRONICS.md", "parts_electronics.yaml"]
    note: "motors, gearboxes, motor controllers and the Systemcore-side electrical budget live in the siblings; this file deliberately does not re-price them"
  schema_divergence_warning: >-
    recheck_prices.sh in this directory parses `url:` / `unit_usd:` keys (the drivetrain schema).
    THIS file uses `source:` / `price_usd:`. The shared script will silently find ZERO rows here.
    Use the Python validator in 02_MANIPULATION_ELEVATION.md Sec 15 for this file, or normalise
    the two schemas before running a combined check.
  evidence_labels:
    C: "Fetched from a live vendor page on 2026-08-22; price quoted verbatim"
    H: "Historical pattern across prior FRC seasons; not stated for BIOCORE"
    S: "Inference, flagged as such"
    UNVERIFIED: "Could not be checked in this pass. Check before spending money."
  # These two rows are `evidence: C` with `price_usd: null` ON PURPOSE. The validator in
  # 02_MANIPULATION_ELEVATION.md Sec 15 will flag them; that is expected, not a defect.
  expected_validator_exceptions:
    - part: "Greyt Universal Elevator v2"
      why: "verified DISCONTINUED / sold out -- there is no price to record"
    - part: "Ratchet Sport"
      why: "vendor publishes only a $44.00-$110.00 range across five verified SKUs; no per-SKU price"
  price_ranges_not_resolved_this_pass:
    - {family: "REV ION Compliant Wheels", range_usd: [6.50, 30.00], verified_skus: 8, source: "https://www.revrobotics.com/ION-Compliant-Wheels/"}
    - {family: "AM Ratchet Sport",         range_usd: [44.00, 110.00], verified_skus: 5, source: "https://andymark.com/products/ratchet-sport"}
    - {family: "WCP Straight Flex Wheels", entry_usd: 2.99, priced_skus: 1, verified_skus: 12, source: "https://store.ctr-electronics.com/products/stretch-core-straight-flex-wheel"}
  pages_that_failed_this_pass:
    - url: "https://www.vexrobotics.com/flex-wheels.html"
      status: "HTTP 403 Forbidden"
      recheck_2026_09_04: "HTTP 403 again. Bot mitigation, not removal -- see price_note below"
    - url: "https://docs.wcproducts.com/greyt-elevator-cascade"
      status: "HTTP 404 at the URL tried"
      recheck_2026_09_04: "HTTP 200. The page is live; the 2026-08-22 404 was transient or the URL
        was mistyped in that pass. This entry is retained rather than deleted so the correction is
        visible, but the page is NOT a failure any more"
    - url: "https://wcproducts.com/products/straight-flex-wheels"
      status: "200, but only an entry price was published; no per-variant table"

# ---------------------------------------------------------------------------------
# Sec 1 -- the fork. Game-piece class decides everything downstream.
# ---------------------------------------------------------------------------------
game_piece_classes:
  a:
    label: "small ball, ~3-7 in."
    prior_examples: ["INFINITE RECHARGE Power Cell ~7in", "STEAMWORKS Fuel ~5in"]
    intake_that_wins: "horizontal over-the-bumper roller, 2 in. compliant wheels on 1/2 hex"
    lift_that_wins: "usually none -- shoot instead"
    small_team_verdict: "best case; cheapest and most COTS-covered"
    evidence: H
  b:
    label: "large ball, >8 in."
    prior_examples: ["RAPID REACT Cargo 9.5in", "2016 Boulder ~10in", "2014 ball 24in"]
    intake_that_wins: "wide roller + polycord bridge, or scoop"
    lift_that_wins: "rare"
    small_team_verdict: "moderate; roller width drives cost"
    evidence: H
  c:
    label: "flat / disc"
    prior_examples: ["2013 Frisbee"]
    intake_that_wins: "sticky roller pair or side-grip belt; hardest to singulate"
    lift_that_wins: "elevator or four-bar"
    small_team_verdict: "hard -- ground pickup of flats is a machining problem"
    evidence: H
  d:
    label: "cube / tote / box"
    prior_examples: ["POWER UP Power Cube 13in", "CHARGED UP Cube 9.5in", "2015 Tote"]
    intake_that_wins: "two opposed vertical roller arms (claw-take)"
    lift_that_wins: "elevator (stacking) or arm"
    small_team_verdict: "moderate; very COTS-friendly; the classic elevator game"
    evidence: H
  e:
    label: "ring / tube / cone"
    prior_examples: ["CRESCENDO Note 14in torus", "CHARGED UP Cone", "DEEP SPACE Hatch Panel"]
    intake_that_wins: "over-the-bumper roller that folds the ring; or passive V-funnel"
    lift_that_wins: "arm / four-bar preferred over elevator"
    small_team_verdict: "moderate; rings forgiving, cones are not"
    evidence: H
  biocore_hint:
    statement: >-
      AndyMark sells the BIOCORE scoring element as a pre-order: Kit-of-Parts quantity $70.00,
      1/5-of-a-field quantity $169.00, described as a custom item manufactured overseas.
      That packaging pattern is consistent with MANY SMALL elements per field.
    evidence: S
    do_not_act_on_it: true
    source: "https://andymark.com/products/biocore-frc-scoring-element-pre-order"

