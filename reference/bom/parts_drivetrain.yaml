# parts_drivetrain.yaml
# Machine-readable companion to reference/bom/01_DRIVETRAIN.md
#
# Every price was fetched from a LIVE vendor product page on 2026-08-22.
# Nothing here is estimated. If a page did not load, the entry carries
# evidence: U and unit_usd: null -- it is NOT filled with a guess.
#
# evidence: C = confirmed against a live vendor page or primary FRC document (2026-08-22)
#           H = historical pattern across prior FRC seasons in this corpus
#           S = speculation / planning estimate
#           U = UNVERIFIED (page 404/403, or the number was not exposed as text)

meta:
  version: 1
  written: 2026-08-22
  prices_fetched: 2026-08-22
  currency: USD
  game: BIOCORE presented by Haas (FRC, 2027 season, FIRST CANOPY)
  kickoff: 2027-01-09T12:00:00-05:00
  team_profile: ~15 students, experienced mentor, below-median funding, no in-house CNC
  control_system_2027: Systemcore (replaces roboRIO); WPILib 2027 is Systemcore-only
  upstream:
    - ../04_PREDICTIVE_FACTORS.md          # sec 3 swerve-vs-tank weight 45; sec 5.1 cost ladder
    - ../team-ops/03_programming_stack.md  # Systemcore hardware + removed features
    - ../../research/00_PREMISE_CORRECTION.md
    - ../../research/rule_inventories/2026_rules_full.txt   # R103/R104/R402-R408
  price_volatility_warning: >
    FRC vendor prices moved mid-season in 2026. Re-run recheck_prices.sh before
    any purchase order. Treat every figure as +/-10% until re-verified.

