# ============================================================ decision output
decision:
  drivetrain_factor_weight: 45        # inherited from ../04_PREDICTIVE_FACTORS.md, NOT re-derived
  weight_scale: 0-100, relative only
  ranks_below: [drive_practice (90), scope_discipline (85)]
  cost_delta_usd:
    narrowest: 425.00       # S2 (2220.00, encoders included) - T2 (1795.00). Both fully verified.
    widest: 2073.88         # S5 delivered (3583.88) - T1 (1510.00), before spares
    cheapest_fielded_swerve_usd: 2220.00     # S2 - only swerve config verified encoder-complete
    cheapest_fielded_tank_usd: 1795.00       # T2
  build_hour_delta:
    narrowest: [9, 16]
    widest: [12, 31]
    evidence: S
  programming_hour_delta:
    with_released_2027_template: [10, 28]
    without_released_2027_template: [45, 95]
    evidence: S
  recommendation_if_ran_swerve_2026: run swerve; reorder the same modules; port software as a named project starting at WPILib 2027 beta
  recommendation_if_never_ran_swerve: >
    DO NOT adopt swerve in 2027. Control-system reset year: WPILib is a breaking rewrite,
    Systemcore has no production units as of 2026-08-22, and no vendor swerve template has
    shipped for it. Run T2, finish by week 4, spend the delta on driver practice (weight 90).
  tiebreaker_question: >
    Can you name the student who will own the swerve software, and are they available
    20 h/week in January? If not, the answer is tank.
  key_quote: >
    "You should pick your drivetrain for 3 reasons: It's the one you know how to build the
    best. It's the one you know how to program the best. It's the one you know how to drive
    the best. None of those reasons have anything to do with the game."
  key_quote_source: https://www.chiefdelphi.com/t/510353/22

# ====================================================== fall pre-order policy
fall_preorder_2026:
  safe_to_order_before_kickoff:
    - chassis or 4 modules plus 1 spare module
    - all drive motors and controllers
    - wheels/tread plus one full spare set
    - bumper cloth (R411/R412 numbering has been stable)
  conditional:
    - part: bumper backings and fasteners
      condition: only if R403 / R405 geometry holds; verify on kickoff day before cutting
  do_not_preorder:
    - part: Systemcore
      why: price unpublished, no production units, availability unknown
    - part: any SPI IMU
      why: SPI is removed in 2027

