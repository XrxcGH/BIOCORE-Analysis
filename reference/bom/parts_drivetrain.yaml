# ================================================================ KOP / KitBot
kop_kickoff_kit:
  name: FIRST KitBot
  url: https://www.firstinspires.org/resources/library/frc/kitbot
  evidence: C
  quote: "a versatile, beginner-friendly robot kit included in the FIRST Robotics Competition Kickoff Kit"
  drivetrain: AM14U6 chassis; AndyMark publishes the drivetrain build guide
  electrical: "the REV Robotics Control System components provided in the rookie Kickoff Kit"
  biocore_2027_info: NONE PUBLISHED as of 2026-08-22 (newest resources are 2026)
  capability_ceiling: alliance captain at a regional / district event
  capability_evidence: C   # 100 unique Everybot-class alliance captains in 2026, per PF sec 3.3
  right_for_small_team_when:
    - nobody has assembled a swerve module before
    - nobody has written field-oriented swerve code before   # weight double for 2027
    - fewer than ~5 reliable mechanical students per build night
    - the robot has 2+ distinct scoring mechanisms
    - total robot budget under ~$6,000
    - fewer than ~20 driver-practice hours achieved last season
  rule_of_thumb: any two of the above true -> take the KOP/tank path

