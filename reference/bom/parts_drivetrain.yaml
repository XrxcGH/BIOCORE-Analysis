# =================================================================== bumpers
bumpers:
  geometry_authority: THE GAME MANUAL. Numbers below are 2026 REBUILT baseline, evidence H for BIOCORE.
  source: research/rule_inventories/2026_rules_full.txt
  rules_2026:
    R402_A_padding:
      min_depth_in: 2.25
      min_height_in: 4.5
      allowed_materials:
        - solid pool noodles or backer rod
        - solid polyethylene closed cell foam (incl. crosslinked), density 1.5-3.0 lb/ft3
        - solid EVA closed cell foam, density 2.0-6.0 lb/ft3
        - foam floor tiles
      evidence: C
    R402_B_backing: {min_height_in: 4.5, must_support_padding: true, evidence: C}
    R402_C_cover: {material: cloth, must_cover: [outward, upward, downward facing surfaces], evidence: C}
    R402_D_fastening:
      requirement: rigid fastening system to the ROBOT PERIMETER
      prohibited: [hook-and-loop tape, tape, cable ties]
      evidence: C
    R403_extension_limit_in: 4.0
    R404_hard_part_limit_in: 1.25
    R404_padding_beyond_hard_parts_in: 2.0
    R405_bumper_zone_in: [2.5, 5.75]
    R406_corner_fill_in: 2.25
    R406_note: a mitered joint between separate segments does NOT satisfy corner fill
    R407: bumpers must not act as wedges
    R408_weight_with_bumpers_lb: 135.0
    R103_weight_without_bumpers_lb: 115.0
    R104_perimeter_max_in: 110.0
    R104_height_max_in: 30
  reference_design: Bumper Guide, Mechanical Resources section of the FIRST Technical Resources page
  material_costs:
    evidence: S            # ALL bumper dollar figures are unverified; no vendor kit page loaded
    plywood_backing_usd: [25, 50]
    pool_noodles_set_usd: [20, 40]
    cloth_per_color_set_usd: [40, 90]
    fasteners_usd: [20, 40]
    planning_total_two_sets_usd: [150, 250]
  small_team_tip: >
    Build ONE set of backings with swappable cloth covers, not two complete sets.

# ============================================================ 2027 Systemcore
systemcore_2027:
  status: replaces the roboRIO; WPILib 2027 is Systemcore-only
  price_usd: null
  price_evidence: U
  price_note: >
    FIRST states it is "on target to meet their goal of offering Systemcore at a lower
    price than the roboRIO" but has published no number. Do not budget a guess.
  production_units_available: false
  drivetrain_impacts:
    helps_swerve:
      - id: five_can_buses
        detail: 5 unique CAN interfaces, FD-capable, up to 8 Mbps, built-in 120 ohm termination (roboRIO had 1 bus @ 1 Mbps)
        consequence: 8-motor + 4-encoder swerve = 12 CAN devices; no CANivore purchase needed
        evidence: C
      - id: onboard_imu
        detail: 400 Hz quaternion, fused robot yaw, 3-axis accel + gyro
        consequence: no Pigeon 2 / navX purchase; field-oriented swerve needs a gyro, so this saving lands on the swerve path
        evidence: C
    hurts_or_writes_off:
      - id: spi_removed
        consequence: ADIS16448, ADIS16470, ADXL345, ADXRS450 are e-waste for 2027
        evidence: C
      - id: analog_gyro_removed
        evidence: C
      - id: counter_removed
        consequence: quadrature IS listed among the 6 reconfigurable I/O modes but is flagged "in progress or subject to change"
        evidence: C
      - id: servo_removed
        consequence: only bites drivetrain if a servo-actuated shifter or PTO release was planned
        evidence: C
      - id: wpilib_2027_breaking_rewrite
        detail: >
          Java edu.wpi.first -> org.wpilib; C++ frc:: -> wpi::; Java 25 / C++23 required;
          NetworkTables v3 removed; Shuffleboard, SmartDashboard, PathWeaver, RobotBuilder,
          LabVIEW all removed.
        consequence: >
          EVERY swerve template (REV MAXSwerve template, YAGSL, CTRE swerve generator,
          Phoenix 6, REVLib) must be re-released for 2027. 2026 swerve code does not port
          by find-and-replace. THIS IS THE DOMINANT 2027 DRIVETRAIN RISK.
        severity: high
        evidence: C
  decision_gate:
    date: 2026-12-01
    test: is a working, public 2027 vendor swerve template available?
    if_no: a first-year swerve team defaults to tank
    evidence: S

