# 04_predictive_factors.yaml
# Machine-readable companion to reference/04_PREDICTIVE_FACTORS.md
# Feeds the achievability rubric build. Weights are 0-100, relative to each
# other only -- they are NOT probabilities and do not sum to anything.
#
# Written 2026-08-22. Team profile the weights are tuned for:
#   ~15 students, experienced mentor, below-median funding, no full practice
#   field assumed, no in-house CNC assumed.
#
# evidence: C = confirmed in a primary source in this corpus
#           H = historical pattern across prior FRC seasons, not stated for BIOCORE
#           S = speculation / inference
#           U = unverified

meta:
  version: 1
  written: 2026-08-22
  game: BIOCORE presented by Haas (FRC, 2027 season, FIRST CANOPY)
  kickoff: 2027-01-09T12:00:00-05:00
  seasons_analysed: [2022, 2023, 2024, 2025, 2026]
  tba_seasons_with_scraped_data: [2023, 2024, 2025, 2026]
  n_team_events_analysed: 30986    # 7208 + 7605 + 8013 + 8160
  statbotics_api: UNAVAILABLE      # api.statbotics.io returned HTTP 500 on all
                                   # data endpoints on 2026-08-22
  tba_api_v3: UNAVAILABLE          # 401, requires X-TBA-Auth-Key; public event
                                   # pages were scraped instead

# ---------------------------------------------------------------- base weights
# Applied before any game-conditional adjustment.
factors:

  drive_practice:
    weight: 90
    evidence: H
    one_line: Hours of driver time on a functioning robot before event 1.
    key_numbers:
      field_wide_score_growth_early_to_late_pct: [49.8, 49.8, 66.8, 73.5]  # 2023..2026
      median_rank_pctile_change_early_to_late: [3.1, 2.5, 1.8, 4.2]
    why: >
      The whole field's output grows 50-74% between a Week 1-2 event and a
      Week 4+ event, yet the median team's rank percentile does not improve.
      Everyone is improving at the same rate, so the only way to gain relative
      ground is to arrive already practised. Cheapest lever a 15-person team has.

  reliability:
    weight: 88
    evidence: C
    one_line: Does the robot finish every match doing its one job.
    key_numbers:
      pct_picked_no_DQ: [62.9, 61.7, 62.1, 64.7]
      pct_picked_with_DQ: [41.6, 22.5, 22.8, 39.4]
      median_rank_pctile_no_DQ: [48.9, 50.0, 49.1, 49.2]
      median_rank_pctile_with_DQ: [75.7, 86.0, 86.4, 74.6]
    why: >
      A single DQ in a team's event halves its chance of being on a playoff
      alliance and moves its median rank percentile from ~49 to 75-86. DQ is a
      crude proxy for "something went wrong", but it is the only breakdown
      signal visible without a TBA API key.

  scope_discipline:
    weight: 85
    evidence: H
    one_line: Number of mechanisms in the critical chain. Fewer is better.
    game_conditional: {if_scoring_rows_ge_8: +10}
    why: >
      Serial reliability. A 5-mechanism chain at 95% each is 77% reliable; a
      2-mechanism chain at 95% each is 90%. FRC 118's Everybot programme shows
      a deliberately 1-2-mechanism robot performing at population parity.

  scoring_output:
    weight: 80
    evidence: C
    one_line: Average alliance match points in the matches you play.
    key_numbers:
      median_auc_predicting_picked_avg_match: [0.856, 0.872, 0.840, 0.801]
      median_auc_predicting_picked_qual_rank: [0.827, 0.826, 0.782, 0.798]
      median_auc_predicting_picked_ranking_score: [0.812, 0.821, 0.777, 0.783]
      median_auc_predicting_picked_avg_auto: [0.755, 0.731, 0.692, 0.700]
    why: >
      Within the contested middle of a field (rank pct 25-90), the public
      "Avg Match" column separates picked from unpicked teams better than
      qualification rank, better than Ranking Score, and much better than
      Avg Auto -- in all four seasons. Captains buy points.

  event_selection:
    weight: 60
    evidence: C
    one_line: Field size of the events you register for.
    key_numbers:
      pct_picked_rank_band_75_90_by_field_size_2026:
        small_lt36: 60.7
        medium_36_45: 25.0
        large_46_60: 15.6
        huge_61plus: 3.1
    why: >
      Identical robot, identical rank band, 20x difference in pick probability
      between a <36-team event and a 61+-team event. This is the highest-value
      decision made off the robot.

  cots_leverage:
    weight: 55
    evidence: C
    one_line: Fraction of the robot bought rather than fabricated.
    why: >
      Drivetrain, motors, controllers, gearboxes and now whole robot archetypes
      (KitBot, Everybot) are purchasable. Custom fabrication still pays for
      geometry no vendor sells, which for a 15-person team is usually 1 part.

  drivetrain_choice:
    weight: 45
    evidence: H
    one_line: Swerve vs tank. Matters less than the practice hours it consumes.
    key_numbers:
      swerve_share_pct: {2023: 50, 2024: 71.2, 2025: 84}
      true_everybot_alliance_captains_2026: 100
      true_everybot_builds_2026: 441
      pct_of_those_captains_on_swerve: 10
    why: >
      90% of the 100 True-Everybot teams that captained an alliance in 2026 were
      NOT on swerve. Swerve is the majority choice, and swerve teams outperform,
      but that comparison is confounded: swerve teams are richer and more
      experienced teams. What is not confounded is that tank still captains.

  auto_capability:
    weight: 40
    evidence: C
    one_line: Points scored in the autonomous period.
    game_conditional: {if_auto_gated_ranking_point: +25}
    key_numbers:
      partial_spearman_auto_vs_rank_given_total_score:
        2023: 0.044   # no AUTO RP
        2024: -0.044  # no AUTO RP
        2025: 0.259   # AUTO RP present
        2026: 0.061   # no AUTO RP
    why: >
      Once total match score is held constant, auto points buy essentially no
      additional qualification rank -- EXCEPT in the one season of the four that
      granted a ranking point gated on an autonomous accomplishment. Read the
      BIOCORE ranking-point table before deciding how much auto to build.

  defense_capability:
    weight: 35
    evidence: C
    one_line: Ability to suppress an opponent's scoring.
    game_conditional:
      per_protected_zone_rule: -8
      one_defender_at_a_time_rule: -15
      pin_count_ge_5s: +10
      major_foul_ge_10pct_of_typical_score: -10
      major_foul_lt_10pct_of_typical_score: +5
    backtest_defense_weight: {2022: 37, 2023: 35, 2024: 11, 2025: 9, 2026: 17}
    key_numbers:
      winning_alliance_pick2_pct_from_bottom_half: [69.3, 74.7, 74.2, 83.6]
      winning_alliance_pick2_median_rank_pctile: [63.2, 66.7, 68.8, 71.0]
    why: >
      The support/defense slot on the alliance that WINS the event is filled
      from the bottom half of the qualification standings 69-84% of the time.
      That is the most reachable banner path for a resource-limited team, and
      it is season-independent. How much defense the rules permit is not.

  vision_localization:
    weight: 30
    evidence: S
    one_line: AprilTag pose estimation, shoot-on-move, path following.
    why: >
      Wrapped into auto_capability's evidence; no independent measurement is
      possible without Statbotics component EPA, which was unavailable.
      Weighted low on its own because it is a force multiplier on mechanisms
      that must already work.

  custom_fabrication:
    weight: 25
    evidence: S
    one_line: In-house CNC / laser / tube capacity.
    why: >
      Named by multiple mentors as a hard gate on top-tier performance, but
      not on the alliance-captain or second-pick paths this rubric targets.
      Outsourced 2D sheet (SendCutSend-class) substitutes for most of it.

# ---------------------------------------------- kickoff-day conditional deltas
# Applied by tools/rubric_weights.py after reading the BIOCORE manual.
game_conditional_rules:
  - id: auto_rp
    reads: a Ranking Point or Bonus NAMED after the autonomous period
    effect: auto_capability += 25
    positive_controls_in_corpus: ["2018 POWER UP Auto-Quest", "2025 REEFSCAPE AUTO RP"]
    negative_controls_in_corpus: [2016, 2017, 2019, 2020, 2021, 2022, 2023, 2024, 2026]
  - id: protected_zones
    reads: count of "<THING> protection" G-rules
    effect: defense_capability -= 8 * n
    observed: {2022: 1, 2023: 0, 2024: 3, 2025: 2, 2026: 1}
  - id: one_defender
    reads: "'1 defender at a time' / 'no more than 1 ROBOT may be on the opponent'"
    effect: defense_capability -= 15
    observed: {2022: false, 2023: false, 2024: false, 2025: true, 2026: false}
  - id: pin_count
    reads: "There's a N-count on PINS"
    effect: defense_capability += 10 if N >= 5
    observed: {2022: 5, 2023: 5, 2024: 5, 2025: 3, 2026: 3}
  - id: foul_cost
    reads: the two "a credit of N points" values in the Rule violations table
    effect: defense_capability -10 if major foul >= 10% of a typical alliance score, else +5
    observed_minor_major: {2022: [4, 8], 2023: [5, 12], 2024: [2, 5], 2025: [2, 6], 2026: [5, 15]}
  - id: scoring_breadth
    reads: number of point-value rows in the season point table
    effect: scope_discipline += 10 if rows >= 8
    observed: {2022: 10, 2023: null, 2024: 8, 2025: 12, 2026: 7}

