# archetype_corpus.yaml
# Machine-readable companion to reference/03_ARCHETYPE_CORPUS.md
#
# The calibration set the achievability rubric is back-tested against.
# 30 strategy/design archetypes from five real FRC seasons (2022-2026), each with
# a known competitive outcome and a known small-team verdict. Effort is weighted
# toward 2026 REBUILT (8 records) -- freshest data, largest sample, and the manual
# BIOCORE most plausibly resembles.
#
# Written 2026-08-22. Team profile every verdict is tuned for:
#   ~15 students, experienced mentor, below-median funding, no dedicated practice
#   field assumed, no in-house CNC assumed.
#
# evidence: C = confirmed against a primary source in this corpus (manual text or
#               scraped TBA data)
#           H = historical pattern across prior FRC seasons, not stated for BIOCORE
#           S = speculation / reconstruction (mechanism counts, cost bands, cycle
#               estimates, difficulty ratings -- all of these are S)
#           U = unverified
#
# IMPORTANT: no record in this file describes BIOCORE. BIOCORE is FRC, kickoff
# 2027-01-09 12:00 ET, and its game is not public as of 2026-08-22. The seven
# `invariants` below carry empty BIOCORE slots to be filled on kickoff day.

meta:
  version: 1
  written: 2026-08-22
  game_being_prepared_for: BIOCORE presented by Haas (FRC, 2027 season, FIRST CANOPY)
  kickoff: 2027-01-09T12:00:00-05:00
  companion_md: reference/03_ARCHETYPE_CORPUS.md
  seasons_in_corpus: [2022, 2023, 2024, 2025, 2026]
  n_archetypes: 30
  primary_calibration_season: 2026
  control_system_note: >
    2027 replaces the roboRIO with Systemcore. Every programming_difficulty value
    in this file was measured under a mature WPILib/roboRIO stack. Apply the
    systemcore_adjustment table before using any of them for 2027 planning.
  sources:
    manuals: manuals/archive/frc/_txt/{2022_RAPIDREACT,2023_CHARGEDUP,2024_CRESCENDO,2025_REEFSCAPE,2026_REBUILT}.txt
    tba: research/predictive_tba/tba_{copr,alliances,matches,rankings}_{2023..2026}.csv
    predictive_factors: reference/04_PREDICTIVE_FACTORS.md
    awards: reference/awards/00_AWARD_LIST_EMPIRICAL_2026.md

# --------------------------------------------------------------- field schema
schema:
  scoring_actions:            "manual-named actions this robot targets, nothing else"
  points_per_cycle:           "points per completed acquire->travel->score->return loop"
  est_cycles_per_match:       "how many such loops fit in the scoring window"
  mechanism_count:            "powered subsystems BEYOND the drivetrain (nominal, not max)"
  drivetrain:                 [tank, swerve, either]
  sensing:                    [none, encoders, gyro+encoders, vision-assist, full-pose]
  marginal_cost_usd:          "[low, high] band BEYOND a base drivetrain + control system, 2026 USD, +/-40%"
  mfg_floor:                  [hand, bandsaw+drill, router, CNC]
  programming_difficulty:     "1 = teleop mapping only ... 5 = closed-loop + vision + multi-step auto"
  drive_practice_sensitivity: [low, med, high, extreme]
  reliability_profile:        "the specific failure mode, and whether it is graceful or total"
  outcome:                    [event-winning, captain-tier, first-pick, second-pick, third-pick, unpicked]
  small_team_verdict:         ["YES", "CONDITIONAL", "MARGINAL", "NO"]

# --------------------------------------------------- empirical base rates [C]
# Derived from research/predictive_tba/. Reproduce with 03_ARCHETYPE_CORPUS.md section 10.2.
base_rates:
  evidence: C
  winning_alliances_with_a_below_median_opr_member:
    2023: {hits: 115, total: 179, pct: 64}
    2024: {hits: 125, total: 182, pct: 69}
    2025: {hits: 135, total: 198, pct: 68}
    2026: {hits: 160, total: 206, pct: 78}
  rank1_seeds_with_a_below_median_opr_member_pct: {2023: 71, 2024: 68, 2025: 71, 2026: 81}
  deepest_picked_team_opr_percentile_median: {2023: 85, 2024: 82, 2025: 88, 2026: 90}
  deepest_picked_team_opr_percentile_p90_event: {2023: 95, 2024: 96, 2025: 96, 2026: 97}
  alliance_score_distribution:
    note: "n = 115,390 alliance-scores, 2023-2026"
    2023: {median: 87,  p25: 62, p75: 114, p90: 139, p99: 178, p99_over_median: 2.0}
    2024: {median: 50,  p25: 35, p75: 68,  p90: 87,  p99: 121, p99_over_median: 2.4}
    2025: {median: 93,  p25: 63, p75: 128, p90: 169, p99: 236, p99_over_median: 2.5}
    2026: {median: 147, p25: 78, p75: 253, p90: 374, p99: 608, p99_over_median: 4.1}
  individual_copr_2026: {n: 8160, median: 38.5, p90: 153.4, p99: 270.6, max: 470.7}
  interpretation: >
    Two-thirds to four-fifths of event-WINNING alliances carry a below-median-scoring
    robot, rising to 78% in 2026 REBUILT. The support, defense, endgame and minimal
    archetypes are the statistically normal path onto a winning alliance for this team
    profile, not a consolation prize. Caveat: OPR percentile cannot distinguish a
    deliberate support robot from a broken one, so this is an UPPER bound.

