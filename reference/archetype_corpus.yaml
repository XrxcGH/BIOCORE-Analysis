# ================================================== cross-season invariants
invariants:

- id: I1
  name: Reliable high-volume single-task scorer
  instances: [R1, R2, R7, F1, F3, C1, C3, G1, P1]
  seasons_present: "5/5"
  median_mechanism_count: 2
  median_marginal_cost_usd: 900
  typical_mfg_floor: router
  typical_programming_difficulty: 3
  small_team_success_rate: "4/9 outright YES; 6/9 when restricted to the fixed-range / single-tier variant; 0/4 at full spec"
  award_pairing: ["Quality Award", "Industrial Design Award"]
  lesson: >
    The SIMPLIFIED variant beats the full one for this team, every season. The delta
    is entirely mechanism_count and programming_difficulty, not concept. The rubric
    must score the VARIANT, never the family.
  biocore_slot_prompt: "What is the single highest-frequency scoring action, and can it be done from one fixed position?"
  biocore_answer: null

- id: I2
  name: Do-everything robot
  instances: [G2, "R1 at full spec", "F1+F3 combined", "C1+C2+C4 combined", "P1+P3 combined"]
  seasons_present: "5/5"
  median_mechanism_count: 4
  median_marginal_cost_usd: 2200
  typical_mfg_floor: CNC
  typical_programming_difficulty: 5
  small_team_success_rate: "0/5"
  award_pairing: ["Creativity Award sponsored by Rockwell Automation (only if it works)"]
  lesson: >
    Zero small-team successes in five seasons. Cost is multiplicative, not additive:
    each extra mechanism multiplies integration debt, and integration debt is paid in
    the weeks that would have been drive practice -- the highest-weighted factor in
    reference/04_PREDICTIVE_FACTORS.md. A rubric that lets a strategy score well by
    SUMMING capability points is broken.
  biocore_slot_prompt: "Do NOT fill this slot. Record it only so there is something explicit to reject."
  biocore_answer: null

- id: I3
  name: Defense specialist
  instances: [R6, F6, C6, G5]
  seasons_present: "5/5"
  median_mechanism_count: 1
  median_marginal_cost_usd: 150
  typical_mfg_floor: hand
  typical_programming_difficulty: 1
  small_team_success_rate: "3/4 YES (G5 CONDITIONAL on the protection rules)"
  award_pairing: ["Judges' Award", "Gracious Professionalism Award"]
  lesson: >
    Value is RULE-DEPENDENT, not constant. Two independent multipliers: score share
    (CRESCENDO, median 50 -- each denied cycle is a large fraction of the match) and
    opportunity cost (REBUILT -- your HUB is dead for 50s, so defense is free). Check
    both. The entire cost of this archetype is DRIVER HOURS, which no cost-and-
    complexity predicate can see.
  biocore_slot_prompt: "Is there any period, zone or state in which our own scoring is impossible or worthless?"
  biocore_answer: null

- id: I4
  name: Endgame specialist
  instances: [R4, F4, C4, G3, P3, P4]
  seasons_present: "5/5"
  median_mechanism_count: 2
  median_marginal_cost_usd: 500
  typical_mfg_floor: bandsaw+drill
  typical_programming_difficulty: 3
  small_team_success_rate: "3/6 outright; 3/3 at the low/mid tier (R4, G3, P4); 0/3 at the top tier (F4 deep cage, C4 trap, P3 traversal)"
  award_pairing: ["Excellence in Engineering Award sponsored by Littelfuse"]
  lesson: >
    The RP threshold is almost never set at the top tier. RAPID REACT's HANGAR RP (16)
    was cleared by 2 MID + 1 HIGH, never needing TRAVERSAL. REBUILT's TRAVERSAL RP (50)
    is cleared by one L3 + one L2. Find the threshold, then buy the CHEAPEST tier that
    clears it.
  biocore_slot_prompt: "What is the largest single-action point value in the last 30 seconds, and what is its RP threshold?"
  biocore_answer: null

- id: I5
