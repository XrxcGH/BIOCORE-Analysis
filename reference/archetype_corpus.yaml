- id: I7
  name: Deliberately-minimal flawless robot
  instances: [R8, F2, C3, G4, P2]
  seasons_present: "5/5"
  median_mechanism_count: 1
  median_marginal_cost_usd: 350
  typical_mfg_floor: hand
  typical_programming_difficulty: 2
  small_team_success_rate: "5/5"
  award_pairing: ["Quality Award", "Excellence in Engineering Award sponsored by Littelfuse"]
  lesson: >
    "It never failed" IS the Quality Award thesis, and it is the only archetype whose
    value is highest exactly when the team's resources are lowest. Caveat: in a
    high-scoring game (REBUILT, median 147) a minimal robot is SAFE rather than
