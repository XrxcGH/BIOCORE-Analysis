# ============================================================== the archetypes
archetypes:

# ---------------------------------------------------------- 2026 REBUILT (8)
- id: R1
  season: 2026
  name: Cycle Cannon (turreted high-rate shooter)
  invariant: I1
  scoring_actions: "FUEL into the active HUB, continuously, from anywhere in the NEUTRAL ZONE"
  points_per_cycle: 32          # 25-40 FUEL per trip, 1 pt each
  est_cycles_per_match: 6
  mechanism_count: 4            # intake, indexer/hopper, flywheel, turret+hood
  drivetrain: swerve
  sensing: full-pose
  marginal_cost_usd: [1200, 2400]
  mfg_floor: CNC
  programming_difficulty: 5
  drive_practice_sensitivity: high
  reliability_profile: "Indexer jams under 30-ball loads; flywheel surface wear shifts range mid-event. Failure is PARTIAL -- rate drops, robot keeps scoring."
  outcome: event-winning
  small_team_verdict: "NO"
  verdict_reason: "The turret + pose-fusion stack is where 15-student teams lose the season. p90 COPR 153 is reachable only with weeks of tuning this team will spend on integration instead of driving."
  evidence: {points: C, field_specs: C, mechanism_and_cost: S, outcome: C}

- id: R2
  season: 2026
  name: Fixed-Zone Bulk Shooter
  invariant: I1
  scoring_actions: "FUEL into the active HUB from ONE surveyed position; single hood angle, single RPM setpoint"
  points_per_cycle: 12          # 8-15 FUEL
  est_cycles_per_match: 5
  mechanism_count: 2            # intake, flywheel (gravity/roller feed, no powered indexer)
  drivetrain: either
  sensing: encoders
  marginal_cost_usd: [600, 1100]
  mfg_floor: bandsaw+drill
  programming_difficulty: 2
  drive_practice_sensitivity: med
  reliability_profile: "One setpoint, one distance. Failure = the burst misses until the driver re-acquires the spot. GRACEFUL."
  outcome: first-pick
  small_team_verdict: "YES"
  verdict_reason: "The highest-value small-team play in REBUILT. Same point currency as R1 at one-third the cost and roughly 40% of the rate -- and 40% of an uncapped game is still above the 38.5 median COPR."
  evidence: {points: C, mechanism_and_cost: S, outcome: H}

- id: R3
  season: 2026
  name: Neutral-Zone Herder / Feeder
  invariant: I6
  scoring_actions: "No direct scoring. Sweeps NEUTRAL ZONE FUEL toward partners, into the DEPOT, and to the OUTPOST CORRAL"
  points_per_cycle: 0
  est_cycles_per_match: null
  indirect_effect: "+20-40% partner throughput [S]"
  mechanism_count: 1
  drivetrain: either
  sensing: none
  marginal_cost_usd: [150, 450]
  mfg_floor: hand
  programming_difficulty: 1
  drive_practice_sensitivity: med
  reliability_profile: "Nothing to break. A bent plow keeps working."
  outcome: second-pick
  small_team_verdict: "YES"
  verdict_reason: "504 FUEL on the field means acquisition, not scoring, is the bottleneck for most robots. Weak pick equity alone -- pair with R4."
  evidence: {field_specs: C, mechanism_and_cost: S, outcome: H}

- id: R4
  season: 2026
  name: TOWER Climber Specialist (LEVEL 3)
  invariant: I4
  scoring_actions: "TOWER LEVEL 3 in END GAME = 30 pts; supplies 30 of TRAVERSAL RP's 50"
  points_per_cycle: 30
  est_cycles_per_match: 1
  mechanism_count: 2            # winch + deployable hook/telescope
  drivetrain: either
  sensing: encoders
  marginal_cost_usd: [250, 700]
  mfg_floor: bandsaw+drill
  programming_difficulty: 2
  drive_practice_sensitivity: high
  reliability_profile: "Single-shot. Miss the hook and the score is 0. TOTAL failure, no partial credit."
  outcome: second-pick
  small_team_verdict: "YES"
  verdict_reason: "30 pts is ~20% of the 147-pt median match from one 15-second action, and TRAVERSAL (50) is satisfied by one L3 plus one L2. Alliance captains shop for this."
  evidence: {points: C, rp_threshold: C, mechanism_and_cost: S, outcome: H}

- id: R5
  season: 2026
  name: AUTO Specialist
  invariant: I5
  scoring_actions: "8 preloaded FUEL + DEPOT FUEL scored in the 20s AUTO; optionally TOWER L1 at 15 (vs 10 in TELEOP)"
  points_per_cycle: 20          # 12-30 pts banked in AUTO
  est_cycles_per_match: 1
  mechanism_count: 0            # reuses whatever the robot already has
  drivetrain: either
  sensing: full-pose
  marginal_cost_usd: [0, 350]
  mfg_floor: hand              # software-only; no fabrication
  programming_difficulty: 4
  drive_practice_sensitivity: low
  reliability_profile: "Fails to a stationary robot. Costs nothing else. GRACEFUL."
  outcome: captain-tier
  small_team_verdict: "YES"
  verdict_reason: "Best points-per-dollar in the corpus: zero mechanisms, 1.5x point premium on TOWER L1. NOTE the wrinkle -- winning the AUTO FUEL count sets your own HUB inactive for SHIFT 1, so the value is banked points, not tempo. See systemcore_adjustment: this is the highest-risk category for 2027."
  evidence: {points: C, shift_mechanic: C, mechanism_and_cost: S, outcome: H}

- id: R6
  season: 2026
  name: Shift Defender / HUB Denier
  invariant: I3
  scoring_actions: "No direct scoring. Denies the opponent's two 25s active SHIFTS while your own HUB is inactive"
  points_per_cycle: 0
  est_cycles_per_match: 2
  indirect_effect: "-30 to -60 opponent points [S]"
  mechanism_count: 1            # optional blocker/wall
  drivetrain: swerve
  sensing: none
  marginal_cost_usd: [0, 350]
  mfg_floor: hand
  programming_difficulty: 1
  drive_practice_sensitivity: extreme
  reliability_profile: "No mechanism to fail. The risk is FOULS, not breakage."
  outcome: second-pick
  small_team_verdict: "YES"
  verdict_reason: "REBUILT is the strongest defense season in this corpus, purely structurally: for 50s your HUB is dead, so defense costs you literally nothing. The manual itself endorses it. Only TOWER protection restricts where you may play."
  evidence: {shift_mechanic: C, defense_rules: C, outcome: C}

- id: R7
  season: 2026
  name: Depot Cycler / Lift Dumper
  invariant: I1
  scoring_actions: "FUEL into the HUB by lifting it over the 72in front lip; short DEPOT loop"
  points_per_cycle: 20          # 15-25 FUEL
  est_cycles_per_match: 4
  mechanism_count: 3            # intake, elevator/conveyor, dump gate
  drivetrain: either
  sensing: encoders
  marginal_cost_usd: [700, 1500]
  mfg_floor: router
  programming_difficulty: 3
  drive_practice_sensitivity: med
  reliability_profile: "Elevator/conveyor is the most jam-prone delivery path in the game. One stuck FUEL kills the run. TOTAL failure."
  outcome: third-pick
  small_team_verdict: MARGINAL
  verdict_reason: "Feasible, but the 72in front lip means lifting costs more per point than shooting. R2 dominates it on every axis. MARGINAL is an economic judgment, not a feasibility one."
  evidence: {hub_height: C, mechanism_and_cost: S, outcome: S}

- id: R8
  season: 2026
  name: Minimal Flawless (plow + LEVEL 1 climb)
  invariant: I7
  scoring_actions: "Herd FUEL toward partners; TOWER LEVEL 1 = 10 TELEOP (15 in AUTO)"
  points_per_cycle: 12
  est_cycles_per_match: 1
  mechanism_count: 1
  drivetrain: either
  sensing: encoders
  marginal_cost_usd: [250, 550]
  mfg_floor: hand
  programming_difficulty: 2
  drive_practice_sensitivity: med
  reliability_profile: "Two independent simple systems. Degrades GRACEFULLY -- lose the climb, keep herding."
  outcome: third-pick
  small_team_verdict: "YES"
  verdict_reason: "The safe floor. But 10-15 pts is a thin share of a 147-pt median match; in REBUILT specifically, minimal is safe rather than valuable."
  evidence: {points: C, mechanism_and_cost: S, outcome: H}

# --------------------------------------------------------- 2025 REEFSCAPE (6)
- id: F1
  season: 2025
  name: L4 Branch Specialist
  invariant: I1
  scoring_actions: "CORAL onto L4 BRANCH (7 AUTO / 5 TELEOP)"
  points_per_cycle: 5
  est_cycles_per_match: 10
