  biocore_slot_prompt: "What is the cheapest action that scores something at all, every single match?"
  biocore_answer: null

# ============================================ the verdict predicate + back-test
# The rubric's first regression test. See 03_ARCHETYPE_CORPUS.md section 10.3.
verdict_predicate:
  form: |
    risk = (mechanism_count >= 3)
         + (programming_difficulty >= 4)
         + (mfg_floor in {router, CNC})
         + (marginal_cost_usd[1] > 1200)
    NO          if risk >= 3
    CONDITIONAL if risk == 2
    YES         if risk <= 1
  agreement_with_hand_labels: "21/30 = 70%"
  disagreements:
    - family: "scope-conditional AUTO"
      records: [F5, C5, P5]
      predicate_says: YES
      hand_says: CONDITIONAL
      root_cause: >
        The predicate cannot see SCOPE. A 1-element auto and a 4-element auto have
        identical cost, mechanism count and mfg floor, and opposite verdicts.
      fix: "add a `scope` dimension; score the scoped variant, not the archetype family"
    - family: "fixed-range variant of a volume scorer"
      records: [C1, P1]
      predicate_says: NO
      hand_says: CONDITIONAL
      root_cause: >
        The predicate scores the full-spec family. The hand label scores the best
        available variant. Same root cause as the AUTO family -- this is section 7.1
        Rule 1 showing up as a measurable prediction error.
      fix: "enumerate variants as separate rubric candidates before scoring"
    - family: "rule-dependent defense window"
      records: [G5]
      predicate_says: YES
      hand_says: CONDITIONAL
      root_cause: "CHARGED UP's protected LOADING ZONE narrowed where defense was legal. Invisible to a cost predicate."
      fix: "read the protection rules from the manual first (section 0, step 5) and gate I3 on the result"
    - family: "borderline cost/mfg, mechanism actually in reach"
      records: [G1, F4]
      predicate_says: [CONDITIONAL, YES]
      hand_says: [YES, CONDITIONAL]
      root_cause: "adjacent-class error; the cost band straddles the $1200 cut and mfg_floor `router` is over-weighted for a single simple part"
      fix: "make mfg_floor a graded term rather than a binary, weighted by how many parts need that floor"
    - family: "economic, not feasibility"
      records: [R7]
      predicate_says: NO
      hand_says: MARGINAL
      root_cause: "MARGINAL is outside the predicate's output range by construction -- it means 'feasible but a cheaper action pays more per dollar'."
      fix: "add a dominance check: flag MARGINAL when another archetype beats it on every field"
  overriding_term_required:
    rule: |
      downgrade YES -> CONDITIONAL if drive_practice_sensitivity == "extreme"
                                   and available_drive_hours_before_event_1 < 20
    why: >
      Defense archetypes are trivially cheap and trivially simple, yet their entire
      cost is driver hours -- an input the cost/complexity predicate cannot see. This
      is consistent with reference/04_PREDICTIVE_FACTORS.md, where drive_practice
      carries the highest weight (90) from independent evidence.

# ================================================== 2027 Systemcore adjustment
# 2027 replaces the roboRIO. Apply BEFORE using any programming_difficulty above.
systemcore_adjustment:
  evidence: S
  status: "no 2027 control-system software has shipped for evaluation as of 2026-08-22"
  bands:
    - applies_to: "teleop-only, open-loop (I3, I6, I7)"
      delta: 0.0
      why: "motor-controller mapping is the first thing any new control system ships working"
    - applies_to: "single closed-loop mechanism (I4, simplified I1)"
      delta: 0.5
      why: "PID/velocity control ports easily; tuning constants do not transfer"
    - applies_to: "odometry / path-following (I5)"
      delta: 1.0
      why: "highest-risk category; vendor swerve and odometry libraries historically lag a new control system by weeks"
    - applies_to: "vision + pose fusion (full I1, I2)"
      delta: 1.0
      also: "treat as UNAVAILABLE in build weeks 1-3"
      why: "coprocessor integration, AprilTag pipelines and NetworkTables stabilise last"
  consequence: >
    I5 is normally this corpus's best points-per-dollar play at a 100% scoped success
    rate. In 2027 it carries real first-season execution risk. Budget for a
    LEAVE-equivalent plus ONE scoring element, not a multi-element path, until the
    Systemcore odometry story is proven at a Week 1 event.

# ====================================================== falsification checks
# What would break this corpus. Run against the BIOCORE manual on 2027-01-09.
falsification_checks:
- check: "Is BIOCORE's scoring element CAPPED in possession?"
  breaks: "section 7.1 Rule 1. A cap compresses the score spread and the simplified I1 variant loses its edge."
- check: "Does BIOCORE have a period or state where scoring is impossible?"
  breaks: "I3's REBUILT-strength verdict. Without it, defense reverts to CONDITIONAL."
- check: "Is the top scoring tier worth more than 2x the bottom tier?"
  breaks: "I7. In REBUILT (flat 1 pt) minimal robots contribute little; in a 2x+ tiered game, less still."
- check: "Does an RP threshold exist that ONE cheap robot can nearly satisfy alone?"
  breaks: "I4's YES. REBUILT TRAVERSAL (50, from L3+L2) and REEFSCAPE BARGE (16, from one deep cage) both did."
- check: "Is AUTO longer than 15s and paid at a premium?"
  breaks: "I5. A 20s AUTO paying 1.5x (REBUILT) is worth software effort; a 10s AUTO paying 1x is not."

# ================================================================ limitations
limitations:
- "Archetype MEMBERSHIP is expert-assigned, not measured. TBA publishes scores, not designs; no public dataset labels a robot as `fixed-zone shooter`. Every mechanism_count, mfg_floor, sensing and marginal_cost_usd value is S."
- "`outcome` is a season-level generalisation. `event-winning` means the archetype was routinely present on winning alliances, not that every instance won."
- "COPR is not contribution. The below-median-OPR base rate cannot distinguish a deliberate support robot from a broken one, so it is an UPPER bound on how often a deliberate support archetype was on a winning alliance."
- "2022 has no scraped TBA data in this repo (research/predictive_tba/ starts at 2023). RAPID REACT records rest on the manual and on pattern, with no local outcome statistics."
- "CRESCENDO point values are labelled C* -- the pdftotext extraction of Table 6-2 misaligns its columns; values were reconciled against the published table layout. Re-verify against the PDF before quoting externally."
- "Cost bands are 2026 USD, exclude drivetrain and control system, and exclude the Systemcore changeover (2027 pricing unknown as of 2026-08-22). Treat every band as +/-40%."
- "No record in this file describes BIOCORE. The seven biocore_answer fields are null by design and are the kickoff-day deliverable."
- "All programming_difficulty values are pre-Systemcore. Apply systemcore_adjustment before use; that adjustment is itself S."
