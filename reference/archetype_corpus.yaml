  programming_difficulty: 4
  drive_practice_sensitivity: high
  reliability_profile: "Elevator setpoints drift with belt stretch; a dropped CORAL on the reef blocks a branch for the rest of the match. PARTIAL failure."
  outcome: event-winning
  small_team_verdict: "NO"
  verdict_reason: "An elevator plus an articulated wrist reaching a 6ft branch is the single most over-attempted mechanism of 2025. It ate small teams' build seasons."
  evidence: {points: C, mechanism_and_cost: S, outcome: C}

- id: F2
  season: 2025
  name: L1 Trough Filler
  invariant: I6
  scoring_actions: "CORAL into the trough, L1 (3 AUTO / 2 TELEOP)"
  points_per_cycle: 2
  est_cycles_per_match: 15
  mechanism_count: 2            # intake + short delivery
  drivetrain: either
  sensing: encoders
  marginal_cost_usd: [350, 800]
  mfg_floor: bandsaw+drill
  programming_difficulty: 2
  drive_practice_sensitivity: med
  reliability_profile: "Ground-level delivery. Almost nothing to jam. GRACEFUL."
  outcome: second-pick
  small_team_verdict: "YES"
  verdict_reason: "CORAL RP required >=7 CORAL on EACH level. The L1 row was the row nobody elite wanted to fill, so a cheap trough filler was RP-critical to alliances that could not spare a cycle."
  evidence: {points: C, rp_threshold: C, mechanism_and_cost: S, outcome: H}

- id: F3
  season: 2025
  name: Processor Cycler
  invariant: I1
  scoring_actions: "ALGAE into the PROCESSOR (6 pts -- the highest single action value in REEFSCAPE)"
  points_per_cycle: 6
  est_cycles_per_match: 6
  mechanism_count: 2            # compliant intake + eject
  drivetrain: either
  sensing: encoders
  marginal_cost_usd: [500, 1100]
  mfg_floor: bandsaw+drill
  programming_difficulty: 2
  drive_practice_sensitivity: med
  reliability_profile: "Compliant-wheel grip on ALGAE degrades over an event. GRACEFUL."
  outcome: first-pick
  small_team_verdict: "YES"
  verdict_reason: "THE inversion case of the corpus: a 6-pt action beat the prestige 5-pt L4 action for less than half the mechanism. Read every row of the point table before choosing."
  evidence: {points: C, mechanism_and_cost: S, outcome: H}

- id: F4
  season: 2025
  name: Deep CAGE Climber
  invariant: I4
  scoring_actions: "BARGE, off-the-ground via deep CAGE = 12 pts"
  points_per_cycle: 12
  est_cycles_per_match: 1
  mechanism_count: 2
  drivetrain: either
  sensing: encoders
  marginal_cost_usd: [400, 900]
  mfg_floor: router
  programming_difficulty: 3
  drive_practice_sensitivity: high
  reliability_profile: "Single-shot; the deep-cage interface tolerance is unforgiving. TOTAL failure."
  outcome: second-pick
  small_team_verdict: CONDITIONAL
  verdict_condition: "YES only if you build a cage-interface practice fixture and log >=50 climbs before event 1. Otherwise the shallow cage (6 pts) is the correct target."
  verdict_reason: "One deep cage alone nearly satisfies BARGE RP (16). High reward, but the failure mode is total and practice-gated."
  evidence: {points: C, rp_threshold: C, mechanism_and_cost: S, outcome: H}

- id: F5
  season: 2025
  name: AUTO Specialist
