# C. SUBMITTED AWARDS -- written submission with a hard deadline
# =====================================================================

first_impact:
  name: "FIRST Impact Award"
  name_tba: "Regional FIRST Impact Award / District FIRST Impact Award / District Championship FIRST Impact Award"
  former_name: "Chairman's Award (through the 2022 season)"
  sponsor: null
  category: submitted
  subcategory: cultural_award
  decided_by: submission_plus_interview
  submission:
    opens: "2026-10-29T12:00:00-04:00"
    closes: "2027-02-11T15:00:00-05:00"
    submitter: "Student Award Submitter or Lead Coach 1 or 2"
    portal: "FIRST Dashboard"
    artifacts:
      - "14 executive summary answers, 500 characters each (last one 250, optional)"
      - "Essay, 10,000 character maximum"
      - "OPTIONAL: video URL, 16:9, 1-3 minutes, hosted on Dropbox/Box/Google Drive, public"
      - "OPTIONAL: FIRST Impact Award Documentation Form (editable Word doc)"
      - "REQUIRED: agree to the FIRST Impact Award Video Consent & Release of Rights Form"
    interview: "12 minutes total: up to 7 min team presentation (incl. setup), 5 min judge Q&A. Max 3 students presenting. 1 silent adult observer allowed."
    judge_portal_opens_2026: "2026-02-16"
    judge_portal_opens_2027: "UNVERIFIED -- expect ~2027-02-15"
  eligibility: >-
    Any team EXCEPT: (a) first-year teams, including rookies and new teams assigned a veteran
    number -- "First year teams will NOT be considered for the award and will not be
    interviewed" (Submitted Awards page, FIRST Impact Award entry, Ineligible Teams, updated
    July 29, 2026; https://www.firstinspires.org/resources/library/frc/submitted-awards); (b)
    Hall of Fame teams within 5 years of their Championship FIA. District
    teams cannot win or interview at Regional or inter-district events. Once per level of
    competition.
  advances: >-
    YES -- the strongest advancement in FRC. District Championship FIA winners get a
    Championship slot. Regional FIA winners advance to Championship consideration; a Regional
    FIA winner who does not otherwise qualify is offered a REMOTE interview to remain eligible
    at Championship. Championship FIA winner enters the Hall of Fame and is pre-qualified for
    the next 8 years.
  criteria_quote: >-
    The award "honors the team that best represents a model for other teams to emulate and best
    embodies the mission of FIRST" (Submitted Awards page, FIRST Impact Award entry updated July
    29, 2026; https://www.firstinspires.org/resources/library/frc/submitted-awards). Paraphrase
    of the same sentence: FIRST describes the award as its most prestigious, and it was formerly
    the Chairman's Award.
  criteria_guidelines_quote: >-
    "The criterion for the FIRST Impact Award has special emphasis on recent accomplishments
    within the last 3 years." (Submitted Awards page, FIRST Impact Award entry updated July 29,
    2026; https://www.firstinspires.org/resources/library/frc/submitted-awards) Paraphrase of
    the next sentence: judges look at what a team sustains over time, not only at the robot
    build window.
  criteria_guidelines_quote_2: >-
    Paraphrase: contenders are expected to have built a robot suited to the season's game. A
    high ranking at the event is not required, but the build must show "more than just the
    minimal effort necessary to field a drivable robot." (Submitted Awards page, FIRST Impact
    Award entry updated July 29, 2026;
    https://www.firstinspires.org/resources/library/frc/submitted-awards)
  judging_axes_quote: >-
    FIA Judging Guidelines (Rev. Jan 2026) divides outreach into 3 areas: "Spreading the FIRST
    Mission", "Impact on the FIRST community", "Inspiring the STEM Future". It tells judges to
    "Consider utilization of team resources, especially when comparing large teams vs small
    teams" (same document, opening paragraph). Paraphrase of the rest of that paragraph: judges
    should also weigh how teams keep their activities going and what each team achieved with the
    resources it had.
  per_event_2026: {events_offered: 56, rows: 56, per_event: 1.00, tier: regional,
    note: "CORRECTED 2026-08-22 -- was tier sum 194/215/1.11. No team is eligible at 194 events."}
  per_event_2026_by_tier:
    "Regional FIRST Impact Award": {events: 56, rows: 56, per_event: 1.00}
    "District FIRST Impact Award": {events: 122, rows: 122, per_event: 1.00}
    "District Championship FIRST Impact Award": {events: 15, rows: 30, per_event: 2.00}
  district_points: 10
  regional_points: 45
  small_team: needs_large_program
  small_team_note: >-
    Only 446 distinct teams won it 2022-2026 and 77.7% of wins went to repeat winners -- the
    highest concentration of any FRC award. Offered at 83.0% of events. The 3-year sustained-
    activity criterion structurally excludes a program that has not been running outreach for
    3 years. The "utilization of team resources" instruction is real and does help small teams,
    but it does not offset a thin multi-year record.
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/submitted-awards"

first_leadership:
