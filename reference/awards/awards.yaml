# awards.yaml -- machine-readable companion to 00_AWARD_LIST_VERIFIED.md
# THE authoritative FRC award list for the 2026-27 (BIOCORE presented by Haas) season.
# Built 2026-08-22. Every `evidence: C` field is traceable to a `source:` URL or to a
# primary document in this corpus. Nothing here is invented.
#
# REGENERATE / RE-VERIFY:
#   python fetch_award_pages.py && python award_diff.py     # exit 0 == this file still valid
#
# SCHEMA (one mapping per award, key = machine-safe slug)
#   name                 exact official 2026 string, sponsor suffix included
#   name_tba             string The Blue Alliance / FRC-Events emits, if different
#   sponsor              null if none
#   category             machine | team_attribute | submitted | performance | individual | standalone
#   decided_by           pit_interview | scheduled_interview | submission_plus_interview |
#                        external_panel | match_play | event_committee | first_hq
#   submission           null, or {opens, closes, submitter, artifacts}
#   eligibility          plain-text gate
#   advances             what winning it does for Championship qualification
#   criteria_quote       short verbatim excerpt from the FIRST authority webpage; the full text is
#                        on the page named in source. All *_quote fields keep FIRST wording short,
#                        in quotation marks and cited; text labeled "Paraphrase" is this
#                        file's summary, not FIRST's wording.
#   per_event_2026       {events_offered, rows, per_event} from TBA 2026 season records.
#                        [CORRECTED 2026-08-22] events_offered is the count of DISTINCT EVENTS at
#                        which the EXACT award name appears -- never an award summed with its
#                        Finalist/Semi-Finalist tier, never Regional+District+DCMP summed into one.
#                        Multi-tier awards carry by_tier: with one entry per exact TBA name; the
#                        top-level figures then describe the tier a normal competing team can reach.
#                        Authority: reference/awards/00_AWARD_LIST_VERIFIED.md 2.1a.
#                        Regenerate/verify: python tools/award_availability.py
#   small_team           winnable | stretch | needs_large_program | not_competable
#   evidence             C | H | S | UNVERIFIED
#   source               URL(s)

meta:
  season: "2026-27"
  game: "BIOCORE presented by Haas"
  program: "FIRST Robotics Competition (FRC)"
  kickoff: "2027-01-09T12:00:00-05:00"
  built: "2026-08-22"
  authority_pages_state_on_their_face: >-
    "This document is considered the authority on Awards Based on Machine Attributes"
    / "This webpage is considered the authority on Awards Based on Team Attributes"
    / "...on Submitted Awards"
  baseline_docs_are_2025_26_revisions: true
  baseline_doc_revs:
    award_workbook: "Rev. Oct 2025"
    judge_manual: "Rev 2 - 2/18/2026"
    fia_judging_guidelines: "Rev. Jan 2026"
    fla_judging_guidelines: "Rev. Feb 2026"
  season_totals_2026:
    regional_events: 56
    district_events: 122
    total_events_in_tba: 218
    median_award_rows_per_event: 18
  stats_method: >-
    All winner-distribution percentages in this file were recomputed 2026-08-22 directly from
    research/awards_tba/tba_awards_{2022..2026}.csv (23,167 award rows, 1,057 year-event pairs).
    Award names were canonicalised across the 5 seasons before aggregation:
    "Chairman's Award" folded into FIRST Impact Award; "Rookie Inspiration Award" folded into
    Rising All-Star Award; "Entrepreneurship Award" folded into Team Sustainability Award;
    all sponsor suffixes stripped. "top-8" means TBA qual_rank <= 8; "bottom half" means
    rank_pct > 50.

# =====================================================================
# A. MACHINE / CREATIVITY / INNOVATION AWARDS
#    Judged from a pit interview. No pre-submission of any kind.
# =====================================================================

autonomous:
  name: "Autonomous Award sponsored by Google.org"
  name_tba: "Autonomous Award sponsored by Google.org"
  sponsor: "Google.org"
  sponsor_conflict: >-
    Judge Manual Rev 2 - 2/18/2026 p.12 prints "sponsored by Google DeepMind".
    The authority webpage and all 208 TBA 2026 event records say "Google.org".
    Treat Google.org as correct; re-check at kickoff.
  category: machine
  decided_by: pit_interview
  submission: null
  eligibility: "Any team. No restriction, no once-per-level cap."
  advances: "No. Machine awards carry District points only (5), no Championship slot."
  criteria_quote: >-
    "Celebrates the team whose machine has demonstrated consistent, reliable, high-performance
    robot operation during autonomous (i.e. non-operated guided) actions during match play."
    (Awards Based on Machine Attributes page, Autonomous entry updated December 18, 2025;
    https://www.firstinspires.org/resources/library/frc/machine-awards) Paraphrase of the rest:
    judged on how well the robot perceives the field, places itself or its mechanisms, and
    carries out tasks.
  criteria_guidelines_quote: >-
    "Consistent and reliable operation is weighted more heavily than the ability to score
    maximum points during any specific autonomously managed actions." (Awards Based on Machine
    Attributes page, Autonomous guidelines, updated December 18, 2025;
    https://www.firstinspires.org/resources/library/frc/machine-awards) Paraphrase of the next
    guideline: judges may credit autonomous behavior during tele-operated play as well as during
    the opening 15 seconds.
  per_event_2026: {events_offered: 208, rows: 208, per_event: 1.00}
  district_points: 5
  small_team: stretch
  small_team_note: >-
    Hardest machine award for a low-seeded team. 80.4% of 2022-2026 winners finished
    qualification top-8; only 4.9% came from the bottom half. Median winner rank pct 9.0.
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/machine-awards"

creativity:
  name: "Creativity Award sponsored by Rockwell Automation"
  sponsor: "Rockwell Automation"
  category: machine
  decided_by: pit_interview
  submission: null
  eligibility: "Any team."
  advances: "No. 5 District points."
  criteria_quote: >-
    "Celebrates a creative robotic component, concept, or attribute that enhances strategy
    of play that was intentionally designed and not discovered." (Awards Based on Machine
    Attributes page, Creativity entry updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/machine-awards)
  criteria_guidelines_quote: >-
    "A team must be able to describe the creative/unique feature(s) and can trace its conception
    and design." (Awards Based on Machine Attributes page, Creativity guidelines, updated
    October 2, 2025; https://www.firstinspires.org/resources/library/frc/machine-awards)
    Paraphrase of the other guidelines: the feature serves a practical purpose tied to the game
    objectives, the team can explain how it managed the risk that a creative design fails, and
    the feature adds to on-field results when it works as intended.
  per_event_2026: {events_offered: 208, rows: 208, per_event: 1.00}
  district_points: 5
  small_team: winnable
  small_team_note: >-
    The most accessible machine award. 28.1% of 2022-2026 winners came from the bottom
    half of qualification; median winner rank pct 31.8; 706 distinct winning teams,
    only 42.5% repeat winners -- the lowest repeat rate of any machine award.
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/machine-awards"

excellence_in_engineering:
  name: "Excellence in Engineering Award sponsored by Littelfuse"
  sponsor: "Littelfuse"
  category: machine
  decided_by: pit_interview
  submission: null
  eligibility: "Any team."
  advances: "No. 5 District points."
  criteria_quote: >-
    "Celebrates the team whose machine incorporates an engineering solution designed to have
    components work together seamlessly." (Awards Based on Machine Attributes page, Excellence
    in Engineering entry updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/machine-awards)
  criteria_guidelines_quote: >-
    "Teams do not have to design a robot that solves all game challenges." (Awards Based on
    Machine Attributes page, Excellence in Engineering guidelines, updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/machine-awards) Paraphrase of the other
    guidelines: the team names the game problems its machine addresses, walks through its
    engineering process from first concept to finished design, and shows a practical, working
    solution that introduced no new problems.
  per_event_2026: {events_offered: 208, rows: 208, per_event: 1.00}
  district_points: 5
  small_team: stretch
  small_team_note: >-
    "Teams do not have to design a robot that solves all game challenges" is the single most
    small-team-friendly sentence in the whole award corpus -- but the empirics do not follow it:
    62.5% of winners were qual top-8, only 11.4% from the bottom half.
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/machine-awards"

industrial_design:
  name: "Industrial Design Award"
  sponsor: null
  sponsor_history: "Was 'sponsored by General Motors' through the 2025 season; unsponsored from 2026."
  category: machine
  decided_by: pit_interview
  submission: null
  eligibility: "Any team."
  advances: "No. 5 District points."
  criteria_quote: >-
    "Celebrates the team whose machine demonstrates industrial design principles, striking a
    balance between form, function, and aesthetics." (Awards Based on Machine Attributes page,
    Industrial Design entry updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/machine-awards)
  criteria_guidelines_quote: >-
    "The entire machine, and not just a single component, or the detailed process used to
    develop the design, is worthy of this recognition." (Awards Based on Machine Attributes
    page, Industrial Design guidelines, updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/machine-awards) Paraphrase of the other
    guidelines: the team explains why its design is clean, simple to execute, and practical, and
    the robot stands apart from others on appearance, design and performance together.
  per_event_2026: {events_offered: 210, rows: 210, per_event: 1.00}
  district_points: 5
  small_team: stretch
  small_team_note: "60.8% of winners qual top-8; 11.9% bottom half. Correlated with build resources."
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/machine-awards"

innovation_in_control:
  name: "Innovation in Control Award sponsored by nVent"
  sponsor: "nVent"
  sponsor_history: "Unsponsored in 2024; nVent from 2025."
  category: machine
  decided_by: pit_interview
  submission: null
  eligibility: "Any team."
  advances: "No. 5 District points."
  criteria_quote: >-
    "Celebrates an innovative control system or application of control components -
    electrical, mechanical or software - to provide unique machine functions." (Awards Based on
    Machine Attributes page, Innovation in Control entry updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/machine-awards)
  criteria_guidelines_quote: >-
    "The innovation is practical; it addresses the game's challenge and is reliable under the
    stress of competition." (Awards Based on Machine Attributes page, Innovation in Control
    guidelines, updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/machine-awards) Paraphrase of the other
    guidelines: the team traces its controls innovation through concept, design, fabrication or
    deployment, and the control system is novel and tied into the machine, the human players and
    match strategy.
  per_event_2026: {events_offered: 208, rows: 208, per_event: 1.00}
  district_points: 5
  small_team: stretch
  small_team_note: "58.5% qual top-8; 10.4% bottom half. One deep, explainable feature beats breadth."
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/machine-awards"

quality:
  name: "Quality Award"
  sponsor: null
  category: machine
  decided_by: pit_interview
  submission: null
  eligibility: "Any team."
  advances: "No. 5 District points."
  criteria_quote: >-
    "Celebrates machine robustness in concept and fabrication" (Awards Based on Machine
    Attributes page, Quality entry updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/machine-awards)
  criteria_guidelines_quote: >-
    "A team must be able to describe their quality plan i.e. how their design ensures robustness
    throughout the entire competition." (Awards Based on Machine Attributes page, Quality
    guidelines, updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/machine-awards) Paraphrase of the other
    guidelines: workmanship shows across the whole robot (welds, fasteners, wiring, finish),
    built-in redundancy and planned risk reduction keep it working through the event, and build
    quality contributes to match results.
  per_event_2026: {events_offered: 209, rows: 209, per_event: 1.00}
  district_points: 5
  small_team: stretch
  small_team_note: "57.6% qual top-8; 12.2% bottom half. A written quality plan is the cheapest lever."
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/machine-awards"

# =====================================================================
# B. TEAM ATTRIBUTE AWARDS
#    Judged from pit interviews / observation. No pre-submission
#    EXCEPT Engineering Inspiration, which is judged off the same pit visit
#    but is a Cultural Award with advancement consequences.
# =====================================================================

engineering_inspiration:
  name: "Engineering Inspiration Award sponsored by SpaceX"
  name_tba: "Regional Engineering Inspiration Award sponsored by SpaceX / District Engineering Inspiration Award sponsored by SpaceX"
  sponsor: "SpaceX"
  sponsor_history: "Unsponsored in 2025; SpaceX from 2026."
  category: team_attribute
  subcategory: cultural_award
  decided_by: pit_interview
  submission: null
  submission_note: >-
    No written submission. This is the highest-value award in FRC that requires zero
    pre-season paperwork.
  eligibility: >-
    Any team at each Regional or District event. Restricted to earning it once per level of
    competition. District teams are NOT eligible at Regionals or inter-district events.
    At District Championship, only District teams that already won EI at a District event.
  advances: >-
    YES. District Championship EI winners earn a Merit-Based FIRST Championship slot.
    Regional EI winners qualify to compete for the award at Championship.
    District EI winners qualify for their District Championship (for the award only).
  criteria_quote: >-
    "Celebrates a team who demonstrates outstanding success in advancing respect and
    appreciation for engineering within a team's school or organization and community." (Awards
    Based on Team Attributes page, Engineering Inspiration entry updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards)
  criteria_guidelines_quote: >-
    Teams describe their work "with an emphasis on the most recent year's efforts, and with
    performance indicators that provide measurable success of their efforts" (Awards Based on
    Team Attributes page, Engineering Inspiration guidelines, updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards). Paraphrase of the listed
    attributes: how widely and inventively the team recruits students into engineering and other
    STEM fields; the reach and results of its community outreach; a commitment to STEM education
    within the team, its school and its community; carrying out the FIRST mission and explaining
    it at events and away from them; and work that continues all year rather than only in build
    and competition season.
  per_event_2026: {events_offered: 56, rows: 56, per_event: 1.00, tier: regional,
    note: "CORRECTED 2026-08-22 -- was {192-style tier sum} 204/211/1.03. Exact names never summed."}
  per_event_2026_by_tier:
    "Regional Engineering Inspiration Award sponsored by SpaceX": {events: 56, rows: 56, per_event: 1.00}
    "District Engineering Inspiration Award sponsored by SpaceX": {events: 123, rows: 123, per_event: 1.00}
    "District Championship Engineering Inspiration Award sponsored by SpaceX": {events: 15, rows: 22, per_event: 1.47}
    "Engineering Inspiration Award sponsored by SpaceX": {events: 8, rows: 8, per_event: 1.00, scope: championship_division}
  district_points: 8
  regional_points: 28
  small_team: stretch
  small_team_note: >-
    Better odds than FIA for a small program: 31.1% of 2022-2026 winners came from the bottom
    half of qualification, median winner rank pct 33.3. Requires a real, measurable,
    year-round outreach record -- but NOT a 10,000-character essay.
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/team-awards"

gracious_professionalism:
  name: "Gracious Professionalism Award"
  sponsor: null
  category: team_attribute
  decided_by: pit_interview
  submission: null
  eligibility: "Any team. No once-per-level cap."
  advances: "No. 5 District points."
  criteria_quote: >-
    "Celebrates outstanding demonstration of FIRST Core Values such as continuous Gracious
    Professionalism, sportsmanship, and working together both on and off the playing field."
    (Awards Based on Team Attributes page, Gracious Professionalism entry updated October 2,
    2025; https://www.firstinspires.org/resources/library/frc/team-awards)
  criteria_guidelines_quote: >-
    "If the team worked with another FIRST Robotics Competition team pre-season - they can
    describe the following:" (Awards Based on Team Attributes page, Gracious Professionalism
    guidelines, updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards) Paraphrase of the
    guidelines: the team shows FIRST Core Values in how it treats other teams and through the
    Gracious Professionalism it demonstrates, and it consistently shows Gracious Professionalism
    and a positive attitude, on the field and off it. For a pre-season partnership
    the checklist has five points: how the collaboration ran in the off-season and the build
    season, how the work was divided fairly, how communication moved between the two teams, why
    working as one group beat working separately, and the financial effect of collaborating
    versus working alone.
  per_event_2026: {events_offered: 211, rows: 211, per_event: 1.00}
  district_points: 5
  small_team: winnable
  small_team_note: >-
    41.2% of 2022-2026 winners came from the bottom half of qualification. 661 distinct
    winners. The pre-season-collaboration bullet is a written checklist a 15-student team can
    satisfy deliberately by partnering with one other team before January.
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/team-awards"

imagery:
  name: "Imagery Award in honor of Jack Kamen"
  sponsor: null
  honoree: "Jack Kamen"
  category: team_attribute
  decided_by: pit_interview
  submission: null
  eligibility: "Any team."
  advances: "No. 5 District points."
  criteria_quote: >-
    "This award celebrates attractiveness in engineering and outstanding visual aesthetic
    integration of machine and team appearance." (Awards Based on Team Attributes page, Imagery
    entry updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards) Paraphrase of the sentence
    before it: the award honors Jack Kamen, father of FIRST founder Dean Kamen, for his art and
    illustration work and his long support of FIRST.
  criteria_guidelines_quote: >-
    "The team must be able to describe its theme and its origins." (Awards Based on Team
    Attributes page, Imagery guidelines, updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards) Paraphrase of the other
    guidelines: the theme is original and suits the team's goals, character or history; it runs
    through uniforms, pit, robot, mascot and the rest of the team's presence; the combined look
    of team and robot is striking; and the theme supports FIRST Core Values.
  per_event_2026: {events_offered: 208, rows: 208, per_event: 1.00}
  district_points: 5
  small_team: winnable
  small_team_note: >-
    47.7% of winners from the bottom half; median winner rank pct 48.7. Cost, not headcount,
    is the constraint -- and the criteria explicitly reward a theme with an origin story,
    which is free.
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/team-awards"

judges:
  name: "Judges Award"
  name_alt: "Judges' Award"
  name_tba: "Judges' Award"
  name_note: >-
    FIRST prints BOTH forms. The team-attributes authority page and the Judge Manual use
    "Judges Award" (no apostrophe); the All Awards list on the main awards page and every TBA
    2026 record use "Judges' Award". Use "Judges Award" in submissions, accept either.
  sponsor: null
  category: team_attribute
  decided_by: pit_interview
  submission: null
  eligibility: "Any team. Discretionary -- judges create the citation."
  advances: "No. 5 District points."
  criteria_quote: >-
    "During the course of the competition, the judging panel may decide a team's unique
    efforts, performance, or dynamics merit recognition." (Awards Based on Team Attributes page,
    Judges Award entry updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards)
  criteria_guidelines_quote: >-
    "The team exemplifies a positive attribute or feature that is not addressed in the criteria
    for other awards that merits recognition." (Awards Based on Team Attributes page, Judges
    Award guidelines, updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards) Paraphrase of the other
    guidelines: the team has fully taken FIRST principles on board, and its strengths have drawn
    comment from many judges.
  per_event_2026: {events_offered: 209, rows: 209, per_event: 1.00}
  district_points: 5
  small_team: winnable
  small_team_note: >-
    The single most accessible judged award in FRC. 787 distinct winning teams 2022-2026 --
    more than any other award -- and only 31.5% of wins go to repeat winners. 49.6% of winners
    came from the bottom half of qualification. Explicitly rewards the thing no other award
    covers.
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/team-awards"

rising_all_star:
  name: "Rising All-Star Award"
  sponsor: null
  history: "New for the 2025 season. Replaced the Rookie Inspiration Award, which was retired after 2024."
  category: team_attribute
  decided_by: pit_interview
  submission: null
  eligibility: >-
    Paraphrase: meant for new teams and for teams making a fresh start. "Teams do not have to be
    in their first year." (Awards Based on Team Attributes page, Rising All-Star guidelines,
    updated October 2, 2025; https://www.firstinspires.org/resources/library/frc/team-awards)
    Judges may decline to present it.
  advances: "No. 5 District points."
  criteria_quote: >-
    Paraphrase: recognizes a team that has kept going through the hardships that come with being
    young. The description continues: "This could be the result of being a new team, or a team
    with recent turnover in membership." (Awards Based on Team Attributes page, Rising All-Star
    entry updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards)
  criteria_guidelines_quote: >-
    One guideline says "the award could recognize a team in their second or third year who has
    undergone significant growth or succeeded despite challenges." (Awards Based on Team
    Attributes page, Rising All-Star guidelines, updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards) Paraphrase of the other
    guidelines: the team understands the FIRST mission and practices Gracious Professionalism
    and Coopertition at home and at events, sets an example for other young teams, and looks
    likely to last and grow in FIRST.
  per_event_2026: {events_offered: 204, rows: 204, per_event: 1.00}
  district_points: 5
  small_team: winnable
  small_team_note: >-
    THE highest-probability target for a small, young, or recently-rebuilt program. Only 8.8%
    of winners were qual top-8; 69.1% came from the bottom half; median winner rank pct 67.5 --
    the only award whose median winner is in the bottom third of the field. Median winning team
    number 9158. Offered at 204/211 events. Eligibility explicitly extends past year one to
    "recent turnover in membership".
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/team-awards"

rookie_all_star:
  name: "Rookie All-Star Award"
  name_tba: "Rookie All Star Award"
  sponsor: null
  category: team_attribute
  subcategory: cultural_award
  decided_by: pit_interview
  submission: null
  eligibility: >-
    Rookie teams only. Judge Manual: "Any team with a team number 10,900 or higher is eligible
    for Rookie Award." (Judge Manual Rev 2 - 2/18/2026, Rookie All-Star Award section, p.14)
    Once per level of competition. District teams not eligible at Regionals or inter-district
    events. Judges may decline to present it.
  advances: >-
    YES. District Championship RAS winners earn a Merit-Based FIRST Championship slot.
    District RAS winners qualify for their District Championship (for the award only).
  criteria_quote: >-
    "Celebrates the rookie team exemplifying a young but strong partnership effort" (Awards
    Based on Team Attributes page, Rookie All-Star entry updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards). Paraphrase of the rest:
    the team also puts into practice the FIRST mission of getting students interested in science
    and technology.
  criteria_guidelines_quote: >-
    "This team seems like a 'FIRST Impact Award team in the making.'" (Awards Based on Team
    Attributes page, Rookie All-Star guidelines, updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards) Paraphrase of the rest: the
    page names community activity, leadership, vision and spirit as signs of this; the team is a
    genuine partnership between its school or organization and its sponsors; it understands that
    technical work is fun, demanding and a route to a future; and it has built a robot suited to
    the game.
  criteria_guidelines_quote_2: >-
    Judge Manual: "Building a robot that is appropriate to the game's challenges means 'did they
    build a robot or not'." (Judge Manual Rev 2 - 2/18/2026, Rookie All-Star Award section,
    p.14) Paraphrase of the rest: a team that built a robot qualifies, and how that robot
    compares with other rookie robots at the event does not matter.
  per_event_2026: {events_offered: 133, rows: 133, per_event: 1.00}
  district_points: 8
  small_team: not_competable
  small_team_note: >-
    Rookie-only gate. Offered at just 133 of 211 events (63%) because judges decline when no
    rookie qualifies. If the team is not a rookie, this is not a lane -- Rising All-Star is the
    substitute and has no rookie gate.
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/team-awards"

team_spirit:
  name: "Team Spirit Award"
  sponsor: null
  category: team_attribute
  decided_by: pit_interview
  submission: null
  eligibility: "Any team."
  advances: "No. 5 District points."
  criteria_quote: >-
    "Celebrates extraordinary enthusiasm and spirit through exceptional partnership and
    teamwork furthering the objectives of FIRST." (Awards Based on Team Attributes page, Team
    Spirit entry updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards)
  criteria_guidelines_quote: >-
    "They demonstrate spirit as a unified team." (Awards Based on Team Attributes page, Team
    Spirit guidelines, updated October 2, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards) Paraphrase of the other
    guidelines: the team shows visible enthusiasm at the event, in how it supports other teams,
    how it looks, and how it deals with teams and judges, and that spirit carries into its
    school, its community, its sponsors and its dealings with other teams.
  per_event_2026: {events_offered: 210, rows: 210, per_event: 1.00}
  district_points: 5
  small_team: winnable
  small_team_note: >-
    51.9% of winners came from the bottom half of qualification -- the second-most
    bottom-half-friendly award after Rising All-Star. 15 loud students beat 60 quiet ones.
    Criteria demand spirit "as a unified team", which is easier at 15 than at 60.
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/team-awards"

team_sustainability:
  name: "Team Sustainability Award sponsored by Dow"
  sponsor: "Dow"
  history: >-
    Introduced 2023 (unsponsored). Dow sponsorship from 2024. Absorbed the retired
    Entrepreneurship Award, which was last offered at scale in 2022 (162 events).
  category: team_attribute
  decided_by: pit_interview
  submission: null
  eligibility: "Any team."
  advances: "No. 5 District points."
  criteria_quote: >-
    "Celebrates a team which has developed sustainable practices that focus on a 'triple bottom
    line' (i.e. People, Prosperity, and Planet)" (Awards Based on Team Attributes page, Team
    Sustainability entry updated October 7, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards). Paraphrase of the rest:
    the aim is positive impact and a team that continues for the long term.
  criteria_guidelines_quote: >-
    "The team must be able to explain their plans and actions associated with one or more of the
    following sustainability initiatives:" (Awards Based on Team Attributes page, Team
    Sustainability guidelines, updated October 7, 2025;
    https://www.firstinspires.org/resources/library/frc/team-awards) Paraphrase of the three
    initiatives: People, recruiting, training and holding on to students, mentors and sponsors;
    Prosperity, fundraising, building and tracking a budget, and spotting and handling risks to
    money and people; Planet, measuring the team's environmental impact, reducing it, and how
    that work helps the team last.
  per_event_2026: {events_offered: 208, rows: 208, per_event: 1.00}
  district_points: 5
  small_team: winnable
  small_team_note: >-
    "one or more of the following" is the loophole -- a team may answer on People alone.
    43.7% of winners from the bottom half. For a 15-student team the succession/retention story
    IS the sustainability story, and a written budget plus a risk register is a weekend of work.
  evidence: C
  source: "https://www.firstinspires.org/resources/library/frc/team-awards"

