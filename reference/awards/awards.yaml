    https://www.firstinspires.org/resources/library/frc/submitted-awards). Paraphrase of the
    rest: the students are on FIRST Tech Challenge or FIRST Robotics Competition teams, and 10th
    and 11th graders may be nominated by their team for standing out in areas like leadership,
    entrepreneurial work, and commitment to advancing the FIRST mission in their communities.
  criteria_guidelines_quote: >-
    One listed criterion: "The student is a role model and can motivate and lead fellow team
    members" (Submitted Awards page, FIRST Leadership Award nomination criteria, updated July
    29, 2026; https://www.firstinspires.org/resources/library/frc/submitted-awards). Paraphrase
    of the other criteria, which the page says are not a closed list: demonstrated leadership
    and commitment to FIRST Core Values; success at raising awareness of FIRST at school and in
    the community; passion for staying involved in FIRST over the long term; personal
    contributions that drive the team's overall success; and proven experience in STEM.
  per_event_2026: {events_offered: 1, rows: 10, per_event: 10.00, tier: championship_only,
    note: "CORRECTED 2026-08-22 -- was 192/400/2.08, the award summed with BOTH subordinate tiers.
      The award itself was given at ONE event in 2026 (2026cmptx), 10 FRC students. 192x overstated.
      The tier a team can realistically reach is Finalist: 71 events."}
  per_event_2026_by_tier:
    "FIRST Leadership Award": {events: 1, rows: 10, per_event: 10.00, event_key: 2026cmptx}
    "FIRST Leadership Award Finalist": {events: 71, rows: 172, per_event: 2.42}
    "District Championship FIRST Leadership Award Semi-Finalist": {events: 120, rows: 218, per_event: 1.82}
  district_points: 0
  small_team: winnable
  small_team_note: >-
    THE most resource-independent award in FRC. Judged on one student, not on a robot, a budget
    or a 3-year outreach record. [CORRECTED 2026-08-22] The realistic target is the FINALIST tier:
    172 Finalists named at 71 events (2.42 per event where offered), plus 218 DCMP Semi-Finalists at
    120 events. The FIRST Leadership Award ITSELF went to 10 FRC students at ONE event (Championship).
    The previously published "400 recognitions over 192 events, 2.08 per event" summed all three
    tiers and must not be quoted. A 15-student team has the same shot as a 60-student team at the two
