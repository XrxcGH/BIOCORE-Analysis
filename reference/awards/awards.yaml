# =====================================================================
# I. JUDGING MECHANICS THAT CHANGE STRATEGY
# =====================================================================

mechanics:
  one_judged_award_per_event:
    quote: '"Do not award the same team more than 1 judged award at a single event."'
    source_doc: "Judge Manual Rev 2 - 2/18/2026, 'Equitable Award Distribution (Spread the Wealth)'"
    consequence: >-
      Chasing five judged awards at one event does not multiply your odds; it dilutes one pitch
      across five stories. Pick ONE primary lane per event and one backup.
    evidence: C
  spread_the_wealth_is_within_event_only:
    quote: >-
      "The 'spread the wealth' philosophy is for within events, not between events." (Judge
      Manual Rev 2 - 2/18/2026, 'Equitable Award Distribution (Spread the Wealth)') Paraphrase
      of the next sentence: judges should not rule a team out of award X because it won award X at
      an earlier event.
    consequence: "Winning Team Spirit at event 1 does not block Team Spirit at event 2."
    evidence: C
  cultural_awards_once_per_level:
    awards: ["FIRST Impact Award", "Engineering Inspiration Award", "Rookie All-Star Award"]
    quote: >-
      "Once a team has won a cultural award, they may not win that award again at the same level
      of competition."
    source_doc: "Judge Manual Rev 2 - 2/18/2026, 'Cultural Awards (FIA, EI, & RAS)', p.14"
    evidence: C
  judged_vs_field_awards_are_independent:
    quote: >-
      Paraphrase: the chance that a team wins the event must not affect a judged-award decision;
      in the manual's words, "do not spread the wealth between judged awards and field awards"
      (Judge Manual Rev 2 - 2/18/2026, 'Equitable Award Distribution (Spread the Wealth)').
    consequence: "Winning the event does not cost you a judged award, and vice versa."
    evidence: C
  district_points_for_awards:
    source_doc: "REB Section 11.1.4 / Table 11-2"
    values: {first_impact: 10, engineering_inspiration: 8, rookie_all_star: 8, all_other_team_judged: 5, not_a_team_award: 0}
    evidence: C
  ceremony_order_2026:
    source_doc: "REB Section 10.6.2 Table 10-2"
    breaks:
      - "Imagery, Gracious Professionalism, Team Spirit, and Rising All Star"
      - "Autonomous, Creativity, Quality, and Industrial Design"
      - "Innovation in Control, Excellence in Engineering, Team Sustainability, Judges"
      - "Rookie All Star, FIRST Leadership Award, Engineering Inspiration"
      - "Remaining awards, Finalists, Winners, and FIRST Impact Award"
    note: >-
      "** Program Delivery Partners may choose to hold these awards until after all MATCHES are
      complete." This 5-line block is the fastest confirmation of the 2027 slate on kickoff day.
    evidence: C
  ai_policy:
    quote: >-
      Paraphrase: teams may use AI to help create award submissions and handouts and to write
      robot code, and FIRST treats AI like other student tools such as CAD and 3D printers.
      "Teams using AI to assist with code or content generation must provide proper credit and
      attribution" (Submitted Awards page, 'Use of Artificial Intelligence (AI)' section,
      2026-27 season version;
      https://www.firstinspires.org/resources/library/frc/submitted-awards). The page gives a
      sample credit line naming the team and the AI tool, and requires teams to respect
      intellectual property and license terms. The same policy text appears in the Judge Manual
      Rev 2 - 2/18/2026 and the FIRST Leadership Award Guide Rev. Feb 2026.
    quote_2: >-
      "Judges should not discredit a team who uses AI or rank them lower simply for using the
      tool." (Submitted Awards page, 'Use of Artificial Intelligence (AI)' section, 2026-27
      season version; https://www.firstinspires.org/resources/library/frc/submitted-awards)
      Paraphrase of the rest: FIRST says sites that claim to detect AI use are not accurate and
      should not be used to check submissions.
    evidence: C
    source: "https://www.firstinspires.org/resources/library/frc/submitted-awards"

# =====================================================================
# J. RANKED SHORTLIST FOR A ~15-STUDENT, FIRST-OR-SECOND-YEAR-COMPETITIVE TEAM
#    Ordering = (empirical bottom-half winner share) x (cost to contest) x (offered-at rate)
# =====================================================================

small_team_ranked_targets:
  - rank: 1
    award: "Rising All-Star Award"
    why: "69.1% of winners from the bottom half of qual; median winner rank pct 67.5; offered at 204/211 events; eligibility explicitly covers 'recent turnover in membership', not just year one"
  - rank: 2
    award: "FIRST Leadership Award"
    why: "judged on ONE student, not on resources; ~2 Finalist slots per event; costs one mentor essay; deadline 2027-02-04"
  - rank: 3
    award: "Judges Award"
    why: "787 distinct winners 2022-2026 (most of any award); 49.6% bottom-half; explicitly for what no other award covers"
  - rank: 4
    award: "Team Spirit Award"
    why: "51.9% bottom-half; criteria reward acting 'as a unified team', which favours 15 students over 60"
  - rank: 5
    award: "Woodie Flowers Finalist Award"
    why: "3,000-character student essay about the mentor; decided off-site by an external panel; robot irrelevant; deadline 2027-02-04"
  - rank: 6
    award: "Imagery Award in honor of Jack Kamen"
    why: "47.7% bottom-half; a theme with an origin story costs nothing but intent"
  - rank: 7
    award: "Safety Animation Award"
    why: "40 seconds of animation, no robot, cash prize -- but the window likely opens ~Oct 2026, BEFORE kickoff"
  - rank: 8
    award: "Team Sustainability Award"
    why: "43.7% bottom-half; 'one or more of' lets you answer on People alone; succession IS the story for a 15-student team"
  - rank: 9
    award: "Gracious Professionalism Award"
    why: "41.2% bottom-half; the pre-season-collaboration bullet is a checklist you can deliberately satisfy before January"
  - rank: 10
    award: "Digital Animation Award"
    why: "fully decoupled from the robot; one student; 2027 theme and deadline not yet published"
  - rank: 11
    award: "Creativity Award"
    why: "the only machine award where the bottom half wins 28.1% of the time and repeat-winner concentration is lowest (42.5%)"
  - rank: 12
    award: "Winner / Finalist"
    why: "reachable via alliance selection as a reliable second or third pick, not via seeding"

effectively_out_of_reach:
  - award: "FIRST Impact Award"
    why: "77.7% of wins go to repeat winners; only 446 distinct teams in 5 seasons; the 3-year sustained-activity criterion structurally requires an established program"
  - award: "Autonomous Award"
    why: "80.4% of winners were qual top-8; 4.9% bottom half -- the most performance-coupled judged award in FRC"
  - award: "Rookie All-Star Award"
    why: "rookie-number gate (team number >= 10,900)"
  - award: "Woodie Flowers Award (Championship)"
    why: "requires already holding a WFFA from a prior season"
  - award: "Founder's Award / Volunteer of the Year / Allaire Medal"
    why: "not team-competable"
