# ---------------------------------------------------------------------------
# 2. FIT MATRIX
# ---------------------------------------------------------------------------

fit_rubric:
  evidence: S
  scale:
    3: The award's decisive published guideline sentence describes this archetype almost verbatim, and the evidence is a byproduct of building it.
    2: Strong fit; evidence exists but must be deliberately produced (a plot, a render, a log).
    1: Arguable; the team must manufacture a story to connect robot to criteria.
    0: No causal link, or a hard eligibility gate blocks it.
  extraction_rule:
    primary: highest-scoring eligible cell
    secondary: next-highest eligible cell
    tie_break_1: higher pct_bottom_half_winners
    tie_break_2: lower marginal student-hours
    exclusions:
      - Columns marked excluded_from_extraction (IMG) and all awards_team_level entries.
      - JUD may not be SECONDARY unless it scores 3 (it cannot be prepared for).

fit_matrix:
  - id: I1
    archetype: Reliable high-volume single-task scorer
    variant: simplified / fixed-position
    scores: {AUT: 1, CRE: 2, EIE: 2, IND: 2, IIC: 2, QUA: 3, JUD: 2, GP: 1}
    img_score: 2
  - id: I2
    archetype: Do-everything robot
    reject_row: true
    scores: {AUT: 1, CRE: 3, EIE: 2, IND: 2, IIC: 2, QUA: 1, JUD: 2, GP: 1}
    img_score: 2
  - id: I3
    archetype: Defense specialist
    scores: {AUT: 0, CRE: 1, EIE: 0, IND: 0, IIC: 0, QUA: 1, JUD: 3, GP: 3}
    img_score: 1
  - id: I4
    archetype: Endgame specialist
    scores: {AUT: 0, CRE: 2, EIE: 3, IND: 1, IIC: 2, QUA: 2, JUD: 2, GP: 1}
    img_score: 2
  - id: I5
    archetype: AUTO specialist
    scores: {AUT: 3, CRE: 2, EIE: 2, IND: 0, IIC: 3, QUA: 1, JUD: 2, GP: 1}
    img_score: 1
  - id: I6
    archetype: Feeder / support robot
    scores: {AUT: 0, CRE: 3, EIE: 1, IND: 2, IIC: 0, QUA: 2, JUD: 2, GP: 3}
    img_score: 2
  - id: I7
    archetype: Deliberately-minimal flawless robot
    scores: {AUT: 0, CRE: 1, EIE: 3, IND: 2, IIC: 0, QUA: 3, JUD: 2, GP: 1}
    img_score: 2

archetype_facts:
  # From AC section 7 / archetype_corpus.yaml. All seven present in 5/5 seasons 2022-2026. [C]
  I1: {mechanisms: 2, marginal_usd: 900, prog_difficulty: 3, small_team: "4/9 outright; 6/9 simplified variant; 0/4 full spec"}
  I2: {mechanisms: 4, marginal_usd: 2200, prog_difficulty: 5, small_team: "0/5 = 0%"}
  I3: {mechanisms: 1, marginal_usd: 150, prog_difficulty: 1, small_team: "3/4"}
  I4: {mechanisms: 2, marginal_usd: 500, prog_difficulty: 3, small_team: "3/6; 3/3 low/mid tier; 0/3 top tier"}
  I5: {mechanisms: 0, marginal_usd: 200, prog_difficulty: 5, small_team: "2/5; 5/5 scoped to 1-2 elements; 0/3 full scope"}
  I6: {mechanisms: 1, marginal_usd: 400, prog_difficulty: 2, small_team: "5/5 = 100%"}
  I7: {mechanisms: 1, marginal_usd: 350, prog_difficulty: 2, small_team: "5/5 = 100%"}

# ---------------------------------------------------------------------------
# 3. THE SEVEN PAIRINGS
# ---------------------------------------------------------------------------

pairings:

  - id: I1
    archetype: Reliable high-volume single-task scorer
    primary:
      code: QUA
      award: Quality Award
      checklist: quality
      fit: 3
      causal_justification: >
        The simplified variant IS a quality plan expressed as hardware: one mechanism
        chain of <=3, one setpoint, one distance, one failure mode, one spare. AC records
        R2's failure profile as graceful. The guideline asks the team to "describe their
        quality plan"; this robot is one.
    secondary:
      code: CRE
      award: Creativity Award sponsored by Rockwell Automation
      checklist: creativity
      fit: 2
      causal_justification: >
        The creative act is the SCOPE decision, not the mechanism - surveying one firing
        position and building the machine around one distance is a strategy-enhancing
        concept "intentionally designed and not discovered", with a documented risk
        mitigation (the shot chart).
      tie_break: CRE 28.1% > IND 11.9% > EIE 11.4% > IIC 10.4%
    disagrees_with_AC_7_2: "AC said Quality + Industrial Design; IND is 11.9% bottom-half and demands whole-machine finish this team cannot fund."

  - id: I2
    archetype: Do-everything robot
    reject_row: true
    warning: >
      DO NOT BUILD FOR THIS ROW. AC records 0/5 small-team successes across five seasons;
      CM caps this team at 2.00 novel mechanisms against I2's median of 4. This row exists
      so the kickoff meeting has something explicit to reject.
    primary:
      code: CRE
      award: Creativity Award sponsored by Rockwell Automation
      checklist: creativity
      fit: 3
      causal_justification: The only FRC award whose criteria pay for ambition.
    secondary:
      code: IND
      award: Industrial Design Award
      checklist: industrial_design
      fit: 2
      causal_justification: '"The entire machine, and not just a single component" is the do-everything pitch verbatim.'
      tie_break: IND 11.9% > EIE 11.4% > IIC 10.4%

  - id: I3
    archetype: Defense specialist
    primary:
      code: JUD
      award: Judges Award
      checklist: judges
      fit: 3
      causal_justification: >
        A defense specialist has, by construction, no machine award to win - every
        AUT/EIE/IND/IIC cell in its row is 0. That is the eligibility condition for the
        guideline "a positive attribute or feature that is not addressed in the criteria
        for other awards." Also the most accessible award in FRC: 787 distinct winners.
      tie_break: JUD 49.6% > GP 41.2% at equal fit 3
    secondary:
      code: GP
      award: Gracious Professionalism Award
      checklist: gracious_professionalism
      fit: 3
      causal_justification: >
        Defense is the one place on an FRC field where sportsmanship is directly
        observable, and Match Observer reports reach the judging panel. Risk: AC records
        I3's failure mode as "foul risk, not breakage" - a dirty defense robot inverts this lane.

  - id: I4
    archetype: Endgame specialist
    primary:
      code: EIE
      award: Excellence in Engineering Award sponsored by Littelfuse
      checklist: excellence_in_engineering
      fit: 3
      causal_justification: >
        "Teams do not have to design a robot that solves all game challenges" legitimizes
        exactly this object: one challenge, one 15-30 second window, one integrated
        mechanism. AC's I4 lesson - find the RP threshold, buy the cheapest tier that
        clears it - IS a documented trade study.
      caveat: 62.5% of EIE winners were still qual top-8.
    secondary:
      code: CRE
      award: Creativity Award sponsored by Rockwell Automation
      checklist: creativity
      fit: 2
      causal_justification: >
        The risk-mitigation clause is written for single-shot mechanisms. AC records I4's
        profile as "single-shot. Miss the hook = 0. No partial credit." The mitigation story
        (N attempts, M successes, backup geometry) is simultaneously the Quality answer.
      tie_break: CRE 28.1% > QUA 12.2% > IIC 10.4%

  - id: I5
    archetype: AUTO specialist
    primary:
      code: IIC
      award: Innovation in Control Award sponsored by nVent
      checklist: innovation_in_control
      fit: 3
      causal_justification: >
        A scoped AUTO specialist is 100% control system and 0% mechanism (AC median
        mechanism count: 0), and the evidence is a telemetry log already recorded. IIC does
        not require out-scoring the field - only "reliable under the stress of competition".
      tie_break: IIC 10.4% > AUT 4.9% at equal fit 3
    secondary:
      code: AUT
      award: Autonomous Award sponsored by Google.org
      checklist: autonomous
      fit: 3
      opportunistic_only: true
      causal_justification: >
        Criteria fit perfectly on paper ("consistent and reliable operation is weighted more
        heavily than the ability to score maximum points") but 80.4% of winners were qual
        top-8 and only 4.9% came from the bottom half - the most performance-coupled judged
        award in FRC. Spend the 6 marginal hours only after seeing your auto beside the field.
    systemcore_risk:
      evidence: H/S
      note: >
        AC section 9.4 applies +0.5 to +1.0 programming-difficulty penalty for the roboRIO ->
        Systemcore transition; I5 is already difficulty 5. Scope the auto to 1-2 elements
        (AC: 5/5 small-team success scoped, 0/3 at full scope). The 2027 logging API is UNVERIFIED.
    disagrees_with_AC_7_2: "AC listed Autonomous first; IIC is 2.1x more open for an identical artifact set."

  - id: I6
    archetype: Feeder / support robot
    primary:
      code: GP
      award: Gracious Professionalism Award
      checklist: gracious_professionalism
      fit: 3
      causal_justification: >
        The design thesis is "make my alliance partners better" - AC R3 measures +20-40%
        partner throughput. The deciding guideline is the pre-season collaboration bullet,
        which is a checklist the team can deliberately satisfy before January (nudge N13).
      tie_break: GP 41.2% > CRE 28.1% at equal fit 3
    secondary:
      code: CRE
      award: Creativity Award sponsored by Rockwell Automation
      checklist: creativity
      fit: 3
      causal_justification: >
        "an attribute that enhances strategy of play" - a robot that scores zero itself and
        raises alliance throughput 20-40% is the purest instance. AC scores I6 at 5/5
        small-team success, so the robot will work; the only question is articulation.
    disagrees_with_AC_7_2: "AC said Industrial Design + Team Spirit; Team Spirit is archetype-independent - a support robot does not cause it."

  - id: I7
    archetype: Deliberately-minimal flawless robot
    primary:
      code: QUA
      award: Quality Award
      checklist: quality
      fit: 3
      causal_justification: >
        "It never failed" IS the Quality Award thesis. AC records I7 as "two independent
        simple systems; degrades gracefully", 5/5 small-team success. The distinguishing
        evidence is a COUNT: matches played, failures, mean time to repair.
      tie_break: QUA 12.2% > EIE 11.4% at equal fit 3
    secondary:
      code: EIE
      award: Excellence in Engineering Award sponsored by Littelfuse
      checklist: excellence_in_engineering
      fit: 3
      causal_justification: >
        "Teams do not have to design a robot that solves all game challenges" is the only
        sentence in FIRST's published criteria that legitimizes a deliberately minimal
        robot. The pitch is a trade study anchored on CM's novel_mechanisms_max = 2.00.

# ---------------------------------------------------------------------------
# 4. MATERIALS CHECKLISTS  (hours = NOMINAL student-hours, [S])
# ---------------------------------------------------------------------------

materials_rules:
  paper_is_a_leave_behind:
    quote: >
      Judges are encouraged to take team provided materials and review them as time allows.
      ... There are no restrictions on page limits of documents but please be aware that
      judges are not expected to review every piece of material handed to them during the
      event and teams are encouraged to include the most relevant information in their interview.
    source: JM
    evidence: C
  do_not_apply_fia_binder_norms:
    note: >
      JM's "no larger than one 2-inch 3-ring binder" guidance is in Chapter 5 and governs the
      scheduled FIRST Impact Award interview, NOT pit machine-award judging. Applying it wastes 30+ hours.
    evidence: C
  invite_the_judges_to_touch:
    quote: "Judges should not touch a team's robot unless directly invited by the team."
    source: JM
    evidence: C
    consequence: 'Every checklist requires the rehearsed line "would you like to try it?" at the 3:00 beat.'

materials_checklists:

  quality:
    award: Quality Award
    thesis: Here is our quality plan, and here is the number that proves it worked.
    total_student_hours: 28
    total_with_habits: 18
    items:
      - {item: "Pit display: the FAILED first prototype, labelled with date + what it taught", h: 1, owner: MECH_LEAD, free_if: N02}
      - {item: "Pit display: one spare of the primary mechanism, on the table, reachable", h: 2, owner: MECH_LEAD}
      - {item: "Pit display: A3 reliability scoreboard, hand-updated between matches (matches / failures / MTTR)", h: 2, owner: PIT_LEAD}
      - {item: "Technical binder (<=10 sheets): quality plan 1p, failure log, maintenance checklist, spares inventory, fastener standard", h: 5, owner: BUILD_LEAD, free_if: N06}
      - {item: "One-page handout, double-sided: quality plan in 5 bullets + reliability number; back = annotated serviceability photo", h: 4, owner: AWARDS_LEAD}
      - {item: "CAD render: exploded view of the primary mechanism showing service access", h: 3, owner: CAD_LEAD, free_if: N08}
      - {item: "Test-data plot: cycles-to-failure / consecutive-successes bar chart, dated", h: 2, owner: AUTO_TELEM, free_if: N03+N07}
      - {item: "Video: 45 s real-time teardown-to-reassembly of the serviceable module", h: 4, owner: MEDIA, optional: true}
      - {item: "5-minute pitch: 3 x 1 h rehearsals with 3 students", h: 3, owner: AWARDS_LEAD}
      - {item: "Judge-question prep, bank Q1-Q6", h: 2, owner: PIT_CREW}

  creativity:
    award: Creativity Award sponsored by Rockwell Automation
    thesis: We designed this on purpose, it changes how the match is played, and here is how we handled the risk.
    total_student_hours: 45
    total_without_bench_rig: 33
    total_with_habits: 22
    items:
      - {item: "Pit display: origin-story board - 4 dated photos (rejected concept -> sketch -> prototype -> final) with the decision sentence under each", h: 8, owner: AWARDS_LEAD, free_if: N01+N04}
      - {item: "Pit display: bench demo rig - the mechanism running off-robot on a battery, guarded", h: 12, owner: MECH_LEAD, optional: true}
      - {item: "Pit display: the rejected alternative, physically present", h: 1, owner: MECH_LEAD, free_if: N02}
      - {item: "Technical binder: concept trade table (>=3 options scored), risk register with mitigations, one page 'what this changes about the match'", h: 5, owner: AWARDS_LEAD, free_if: N04}
      - {item: "One-page handout: concept in one sentence, trade table, risk/mitigation pair, one photo", h: 4, owner: AWARDS_LEAD}
      - {item: "CAD render: side-by-side of the rejected concept and the chosen one", h: 4, owner: CAD_LEAD}
      - {item: "Test-data plot: before/after on the metric the concept was meant to move", h: 3, owner: AUTO_TELEM, free_if: N03}
      - {item: "Video: 30 s of the mechanism working. No narration, no music", h: 3, owner: MEDIA}
      - {item: "5-minute pitch", h: 3, owner: AWARDS_LEAD}
      - {item: "Judge-question prep, bank Q1-Q4 + Q7-Q9", h: 2, owner: PIT_CREW}

  industrial_design:
    award: Industrial Design Award
    thesis: The whole machine is one coherent object.
    total_student_hours: 35
    gate: Only chase if CAD_LEAD kept the assembly current all season (nudge N08).
    items:
      - {item: "Pit display: integration photo grid - 6 photos showing the same design language across subsystems", h: 5, owner: MEDIA, free_if: N01}
      - {item: "Pit display: written design-language statement (colour, fastener standard, bend radius, wire routing rule)", h: 3, owner: CAD_LEAD}
      - {item: "Robot with visible dressed wiring and labelled harness", h: 0, owner: ELECTRICAL, costed_as: N05}
      - {item: "Technical binder: full-robot CAD screenshots, design-language statement, manufacturing plan", h: 4, owner: CAD_LEAD, free_if: N08}
      - {item: "One-page handout: isometric render + 5 callouts naming the repeated design decision", h: 4, owner: CAD_LEAD}
      - {item: "CAD renders: 1 isometric hero + 1 exploded full robot + 1 packaging/volume section", h: 8, owner: CAD_LEAD}
      - {item: "Mass/volume budget table (substitutes for a test-data plot)", h: 2, owner: CAD_LEAD}
      - {item: "Video: 30 s CAD turntable cutting to the same angle on the real robot", h: 4, owner: MEDIA}
      - {item: "5-minute pitch", h: 3, owner: AWARDS_LEAD}
      - {item: "Judge-question prep, bank Q10-Q13", h: 2, owner: PIT_CREW}

  excellence_in_engineering:
    award: Excellence in Engineering Award sponsored by Littelfuse
    thesis: We chose not to solve every challenge, and here is the documented process that decided it.
    total_student_hours: 30
    total_with_habits: 18
    gate: Do not attempt without a real, dated decision record (nudge N04).
    items:
      - {item: "Pit display: the decision record, printed - one dated line per decision, 'we chose X over Y because Z'", h: 2, owner: AWARDS_LEAD, free_if: N04, cold_cost_h: 12}
      - {item: "Pit display: A3 RP-threshold trade table (which tier clears the threshold most cheaply)", h: 3, owner: STRATEGY, when: kickoff weekend}
      - {item: "Technical binder: requirements -> constraints -> options -> decision, one page per subsystem, <=4 pages", h: 6, owner: CAD_LEAD}
      - {item: "One-page handout: the trade study, the number that decided it, the capacity constraint (2.00 novel mechanisms)", h: 4, owner: AWARDS_LEAD}
      - {item: "CAD render: integration view - how the endgame mechanism shares structure with the drivetrain", h: 4, owner: CAD_LEAD}
      - {item: "Test-data plot: attempts vs successes over the season, dated, showing the learning curve", h: 3, owner: AUTO_TELEM, free_if: N07}
      - {item: "Video: 40 s - the mechanism, then the same mechanism after the redesign", h: 3, owner: MEDIA}
      - {item: "5-minute pitch", h: 3, owner: AWARDS_LEAD}
      - {item: "Judge-question prep, bank Q7-Q9 + Q14-Q16", h: 2, owner: PIT_CREW}

  innovation_in_control:
    award: Innovation in Control Award sponsored by nVent
    thesis: This control loop is practical, it addresses the game, it is reliable under stress - and here is the log.
    total_student_hours: 40
    total_without_bench_rig: 32
    systemcore_risk_hours: 2
    items:
      - {item: "Pit display: a laptop showing the actual telemetry plot from the LAST match, updated between matches", h: 3, owner: AUTO_TELEM, free_if: N03}
      - {item: "Pit display: sensor map - robot photo with every sensor circled and named", h: 2, owner: CONTROLS}
      - {item: "Pit display: bench rig running the control loop with a knob to disturb it", h: 8, owner: CONTROLS, optional: true}
      - {item: "Technical binder: control architecture diagram, sensor list w/ part numbers, dated tuning log, Systemcore port notes", h: 6, owner: CONTROLS}
      - {item: "One-page handout: the loop as one block diagram, the sensor list, one plot", h: 4, owner: AUTO_TELEM}
      - {item: "Control block diagram (substitutes for a CAD render)", h: 3, owner: CONTROLS}
      - {item: "Test-data plots (>=2): setpoint vs actual over one match; success rate across N attempts", h: 4, owner: AUTO_TELEM, free_if: N03+N07}
      - {item: "Video: 30 s split-screen, robot moving beside the live plot", h: 5, owner: MEDIA}
      - {item: "5-minute pitch", h: 3, owner: CONTROLS}
      - {item: "Judge-question prep, bank Q17-Q21", h: 2, owner: CONTROLS}

  autonomous:
    award: Autonomous Award sponsored by Google.org
    thesis: It runs the same way every time.
    total_student_hours: 6
    note: Marginal cost only - 100% reuse of the innovation_in_control checklist. Opportunistic; spend only if the auto is visibly top-3 at the event.
    items:
      - {item: "All innovation_in_control artifacts", h: 0, owner: AUTO_TELEM}
      - {item: "Test-data plot: auto success rate - N runs, M identical outcomes, plotted by date", h: 2, owner: AUTO_TELEM}
      - {item: "One-page handout addendum: the auto path on a field diagram with the timing budget", h: 3, owner: AUTO_TELEM}
      - {item: "Pitch delta: swap the 'innovation' paragraph for a 'repeatability' paragraph", h: 1, owner: AWARDS_LEAD}

  judges:
    award: Judges Award
    thesis: There is no pitch. Be legible and memorable.
    total_student_hours: 8
    note: Best hours-to-odds ratio of any lane in this file. AP section 3.8 calls it "the one you cannot pitch".
    items:
      - {item: "Pit display: one honest object explaining the unusual choice - for I3, a printed denial heat map + opponent scoring-rate delta", h: 4, owner: STRATEGY}
      - {item: "Pit display: nothing else. Clean pit, tools racked, robot visible", h: 0, owner: PIT_LEAD}
      - {item: "Technical binder: DO NOT BUILD ONE", h: 0, owner: null}
      - {item: "One-page handout: the strategic thesis in 5 sentences + the heat map", h: 3, owner: STRATEGY}
      - {item: "CAD render / test plot / video: not applicable", h: 0, owner: null}
      - {item: "5-minute pitch: the same 90-second opener every student can give", h: 0, owner: ALL, free_if: N11}
      - {item: "Judge-question prep: rehearse 'why did you build it that way?'", h: 1, owner: PIT_CREW}

  gracious_professionalism:
    award: Gracious Professionalism Award
    thesis: We are measurably better for the teams around us.
    total_student_hours: 31
    hours_before_kickoff: 8
    items:
      - {item: "Pre-season collaboration executed and documented: date, other team #, what was shared, hours, dollars saved both sides", h: 8, owner: MENTOR, when: 2026-10 to 2026-12, cannot_be_retrofitted: true}
      - {item: "Pit display: collaboration one-pager + dated photo of the two teams together", h: 2, owner: MEDIA}
      - {item: "Pit display: a visibly stocked lending shelf (spare battery, fasteners, tools) with a 'borrow this' sign", h: 2, owner: PIT_LEAD}
      - {item: "2-page collaboration log with dates and named teams (substitutes for a technical binder)", h: 3, owner: AWARDS_LEAD}
      - {item: "One-page handout: collaboration table + the alliance-throughput number (+20-40% partner effect for I6)", h: 4, owner: AWARDS_LEAD}
      - {item: "Strategy diagram of the support role (substitutes for a CAD render)", h: 3, owner: STRATEGY}
      - {item: "Test-data plot: partner scoring rate with vs without your support robot, from your own scouting", h: 4, owner: SCOUT}
      - {item: "Video: skip", h: 0, owner: null}
      - {item: "5-minute pitch", h: 3, owner: AWARDS_LEAD}
      - {item: "Judge-question prep, bank Q22-Q25", h: 2, owner: PIT_CREW}

shared_artifact_library:
  # hours_cold = build it from nothing late in the season.
  # hours_warm = the marginal cost when the section-4 habits are running.
  totals: {hours_cold: 89, hours_warm: 21, ratio: 4.2}
  artifacts:
  - {artifact: Dated build/decision photos,        lanes: [QUA, CRE, IND, EIE, IIC, AUT, GP], hours_cold: 20, hours_warm: 0.0}
  - {artifact: Failure / match log,                 lanes: [QUA, EIE, IIC, AUT],               hours_cold: 10, hours_warm: 0.0}
  - {artifact: Design-decision record,              lanes: [CRE, IND, EIE, IIC, JUD],          hours_cold: 12, hours_warm: 2.5}
  - {artifact: Full-robot CAD kept current,         lanes: [IND, EIE],                         hours_cold: 20, hours_warm: 8.0}
  - {artifact: Origin-story board,                  lanes: [CRE, EIE, IIC],                    hours_cold: 12, hours_warm: 3.0}
  - {artifact: The kept failed prototype,           lanes: [QUA, CRE, EIE],                    hours_cold: 1,  hours_warm: 0.25}
  - {artifact: Telemetry plots,                     lanes: [QUA, CRE, EIE, IIC, AUT],          hours_cold: 8,  hours_warm: 2.0}
  - {artifact: Attempt/success tally,               lanes: [QUA, CRE, EIE, IIC, AUT, GP],      hours_cold: 6,  hours_warm: 1.0}
  - {artifact: Bench demo rig,                      lanes: [CRE, IIC],                         hours_cold: 12, hours_warm: 12.0}
  - {artifact: Rehearsed 90-second opener,          lanes: [all],                              hours_cold: 3,  hours_warm: 3.0}

pitch_outline_5min:
  - {t: "0:00-0:30", beat: The one sentence, who: Student A, content: "Name the archetype, not the game. '15 students. We built one thing and we built it to work every match.'"}
  - {t: "0:30-1:30", beat: The decision, who: Student B, content: "What we did NOT build and the number that decided it. Hand over the one-pager HERE, not at the end."}
  - {t: "1:30-3:00", beat: Lane-specific middle, who: Student C, content: "QUA quality plan + reliability count | CRE origin story + risk mitigation | EIE trade study | IIC the plot on the laptop | GP the collaboration table"}
  - {t: "3:00-3:30", beat: The invitation, who: Student C, content: "'Would you like to try it?' Hand them the spare or the bench rig. JM forbids them touching the robot uninvited."}
  - {t: "3:30-4:30", beat: Their questions, who: anyone, content: "'I don't know, but she does' is a correct answer."}
  - {t: "4:30-5:00", beat: The close, who: Student A, content: "One forward-looking sentence: what we would change, and the date we found that out."}

judge_question_bank:
  Q1:  {q: "What breaks most often?", lanes: [QUA, CRE], artifact: failure log}
  Q2:  {q: "How long to swap it at an event?", lanes: [QUA], artifact: MTTR number + spare on the table}
  Q3:  {q: "Show me your spares.", lanes: [QUA], artifact: spares inventory}
  Q4:  {q: "What did you change after your first event?", lanes: [QUA, CRE, EIE], artifact: dated decision record}
  Q5:  {q: "How do you know it is reliable?", lanes: [QUA, IIC, AUT], artifact: attempt/success tally}
  Q6:  {q: "Who on the team knows how to fix this?", lanes: [QUA], artifact: name two students, both present}
  Q7:  {q: "Was that intentional or did you discover it?", lanes: [CRE], artifact: origin-story board}
  Q8:  {q: "What was the risk, and what did you do about it?", lanes: [CRE], artifact: risk register}
  Q9:  {q: "What else did you consider?", lanes: [CRE, EIE], artifact: trade table + kept failed prototype}
  Q10: {q: "Walk me around the whole robot.", lanes: [IND], artifact: integration photo grid}
  Q11: {q: "Why is everything the same colour / fastener?", lanes: [IND], artifact: design-language statement}
  Q12: {q: "Did you CAD it before you built it?", lanes: [IND, EIE], artifact: current assembly on a laptop}
  Q13: {q: "How do you get to the battery?", lanes: [IND, QUA], artifact: live demo, timed}
  Q14: {q: "What did you choose not to build?", lanes: [EIE], artifact: trade study + capacity number}
  Q15: {q: "Why is that the right scope for your team?", lanes: [EIE], artifact: "'Two novel mechanisms is our measured ceiling'"}
  Q16: {q: "How did you decide the endgame tier?", lanes: [EIE], artifact: RP-threshold table}
  Q17: {q: "What sensors are on it?", lanes: [IIC], artifact: sensor map photo}
  Q18: {q: "Show me the data.", lanes: [IIC, AUT], artifact: laptop plot from the LAST match}
  Q19: {q: "What is different about Systemcore?", lanes: [IIC], artifact: port notes - a 2027-only differentiator}
  Q20: {q: "What happens if the sensor fails?", lanes: [IIC], artifact: degradation path stated out loud}
  Q21: {q: "How many times has the auto run identically?", lanes: [AUT], artifact: success-rate plot}
  Q22: {q: "Who have you helped this season?", lanes: [GP], artifact: collaboration log with dates}
  Q23: {q: "What did that cost you?", lanes: [GP], artifact: the financial-impact line the guideline asks for}
  Q24: {q: "How does your robot help your partners?", lanes: [GP], artifact: partner-throughput plot}
  Q25: {q: "Tell me about a time you lost.", lanes: [GP, JUD], artifact: unrehearsable - answer honestly and briefly}

# ---------------------------------------------------------------------------
# 5. DESIGN NUDGES, RANKED BY HOURS-TO-ODDS RATIO   [S]
# ---------------------------------------------------------------------------

design_nudges:
  method: >
    ratio = estimated odds lift / nominal student-hours. Odds lift is a judgement band,
    not a measurement. The RANKING is the deliverable; the stars are not probabilities.
  ranked:
    - id: N01
      rank: 1
      nudge: Photograph every subsystem at every revision, dated, into one shared album
      hours: 0.5
      odds_lift: large
      stars: 5
      feeds: [QUA, CRE, IND, EIE, IIC, GP, IMG]
      helps_performance: true
      note: AP section 5.1 calls this the single highest-leverage habit. Decide it in week 1 of build, not week 6.
    - id: N02
      rank: 2
      nudge: Keep the failed prototype. Label it with the date and one sentence
      hours: 0.25
      odds_lift: medium
      stars: 5
      feeds: [CRE, QUA, EIE]
      helps_performance: false
      note: The only artifact here that can never be reconstructed later.
    - id: N03
      rank: 3
      nudge: Turn on on-robot logging for every enabled session
      hours: 2
      hours_systemcore_risk: 2
      odds_lift: large
      stars: 5
      feeds: [IIC, AUT, QUA, EIE, CRE]
      helps_performance: true
      note: Converts the Innovation in Control lane from "build something" to "open the laptop". Halves debug time. 2027 logging API is UNVERIFIED - establish the habit on the 2026 robot.
    - id: N04
      rank: 4
      nudge: "Write the design-decision record as you go: 15 min/week - date, decision, alternative, reason"
      hours: 2.5
      odds_lift: large
      stars: 4
      feeds: [EIE, CRE, IND, JUD]
      helps_performance: true
      note: Reconstructing it in week 9 costs 12 h and produces a worse, half-invented artifact.
    - id: N07
      rank: 5
      nudge: "Number your reps: a wall tally of attempts vs successes for the primary mechanism"
      hours: 1
      odds_lift: medium-large
      stars: 4
      feeds: [QUA, CRE, EIE, IIC, AUT]
      helps_performance: true
      note: "'214 climbs attempted, 197 succeeded' is the most persuasive sentence available to a small team. PF weights drive practice at 90."
    - id: N11
      rank: 6
      nudge: A rehearsed 90-second opener every student can give. Three 1-hour rehearsals
      hours: 3
      odds_lift: large
      stars: 4
      feeds: [all]
      helps_performance: true
    - id: N06
      rank: 7
      nudge: "One-row match/failure log: match #, what broke, minutes to fix"
      hours: 3
      odds_lift: medium
      stars: 3
      feeds: [QUA, EIE, IIC]
      helps_performance: true
    - id: N13
      rank: 8
      nudge: One documented pre-season collaboration with another FRC team, Oct-Dec 2026
      hours: 8
      odds_lift: large (for GP)
      stars: 3
      feeds: [GP, JUD]
      helps_performance: true
      window: 2026-10 to 2026-12
      note: Directly satisfies the GP deciding guideline. Cannot be retrofitted in season.
    - id: N05
      rank: 9
      nudge: Wire management + labelled harness (loom, service loops, labels at both ends)
      hours: 6
      odds_lift: medium
      stars: 3
      feeds: [IND, IMG, QUA]
      helps_performance: true
      note: The single largest cut to pit debug time.
    - id: N09
      rank: 10
      nudge: One-page handout, one design, reused across lanes
      hours: 4
      odds_lift: medium
      stars: 3
      feeds: [all]
      helps_performance: false
    - id: N08
      rank: 11
      nudge: Keep the CAD assembly current with a clean feature history and named parts
      hours: 8
      odds_lift: medium
      stars: 2
      feeds: [IND, EIE]
      helps_performance: true
    - id: N12
      rank: 12
      nudge: Decide the theme in week 1 (name, two colours, one shape); apply to pit, shirts, robot panels
      hours: 2
      odds_lift: medium (for IMG)
      stars: 2
      feeds: [IMG, SPI]
      helps_performance: false
    - id: N10
      rank: 13
      nudge: Bench demo spare of the primary mechanism on a battery with a guard
      hours: 12
      odds_lift: large (for CRE, IIC)
      stars: 2
      feeds: [CRE, IIC]
      helps_performance: true
      note: It is also a real spare.
    - id: N14
      rank: 14
      nudge: Paint / consistent finish on visible surfaces
      hours: 8
      odds_lift: small-medium
      stars: 1
      feeds: [IND, IMG]
      helps_performance: false
    - id: N15
      rank: 15
      nudge: A 60-90 s robot video cut from photos you already have
      hours: 8
      odds_lift: small
      stars: 1
      feeds: []
      helps_performance: false
      note: No pit-judged award requires a video. Ranked last for that reason.
    - id: N16
      rank: 16
      nudge: Safety Animation Award entry (40 s animation, no robot, cash prize)
      hours: 20
      odds_lift: own lane
      stars: 2
      feeds: [SAA]
      helps_performance: false
      window: "~2026-10-13 to ~2026-11-20 [H] - UNVERIFIED for 2027; watch https://www.firstinspires.org/resources/library/safety weekly from 2026-09-01"
      note: Costs zero build-season hours. Pays $500 winner / $250 each of two finalists against next season's registration.
  deliberately_excluded:
    - {item: A large technical binder, reason: "Judges are not expected to read it; FIA binder norms do not apply to pit judging."}
    - {item: A robot video for its own sake, reason: No pit-judged award requires one.}
    - {item: A separate award-materials sub-team, reason: CM section 4.1 - 15 students already cover 14+ functions with mandatory role sharing.}

# ---------------------------------------------------------------------------
# 6. ANTI-PATTERNS
# ---------------------------------------------------------------------------

anti_patterns:
  - id: AP1
    name: Chasing an award the robot does not support
    instances:
      - {case: Building for I2 because Creativity and Industrial Design have attractive criteria, evidence: "AC 0/5 small-team successes; CM novel_mechanisms_max = 2.00 vs I2 median 4"}
      - {case: Chasing the Autonomous Award with a one-element auto, evidence: "80.4% of winners qual top-8; median winner at the 9.0th rank percentile"}
      - {case: Chasing the FIRST Impact Award without a 3-year record, evidence: "77.7% repeat winners; 446 distinct teams in 5 seasons; 40+ hours that buy more elsewhere"}
    test: Can you name the sentence in WEB-M / WEB-T that describes your robot? If not, the fit is 1, not 3.
  - id: AP2
    name: Retrofitting a story
    cost: "4.2x - 89 cold hours vs 21 warm (see shared_artifact_library totals)"
    detectability: >
      Every retrofitted artifact lacks DATES, and the criteria repeatedly ask date questions:
      "measurable success" (EI), "intentionally designed and not discovered" (CRE),
      "pre-season" collaboration (GP).
    rule: If an artifact cannot carry a truthful date, do not make it. Make a different one.
  - id: AP3
    name: Spreading thin
    evidence: 'JM: "Do not award the same team more than 1 judged award at a single event." AP section 4: two prepared lanes plus the free Judges option is the efficient frontier.'
    arithmetic: A prepared lane costs 28-45 h cold; the in-season budget is 46-73 nominal student-hours. Two fit. Three displace the drive practice PF weights at 90.
  - id: AP4
    name: Binder inflation
    cost: 30+ student-hours
    fix: "<=10 sheets, one bound unit, plus a one-pager you actually hand over."
  - id: AP5
    name: The untouched demo
    cost: 8-12 h wasted
    fix: 'Put "would you like to try it?" in the rehearsed script at the 3:00 beat.'
  - id: AP6
    name: Overclaiming
    cost: Credibility. Match Observers verify (AP section 5.4).
    fix: Claim the reliability number you measured, not the design intent.
  - id: AP7
    name: Printing sponsor suffixes early
    evidence: A sponsor moved on at least one award in every season 2022-2026 (AV section 1.2).
    fix: Print the unsponsored short name until the 2027 award pages re-issue (Oct-Dec 2026).

