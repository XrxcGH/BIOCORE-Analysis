# award_alignment_matrix.yaml
# Companion to reference/awards/AWARD-ALIGNMENT.md
#
# Award names are taken verbatim from reference/awards/awards.yaml, which is the only
# authority in this project for award naming (see 00_AWARD_LIST_VERIFIED.md).
# BIOCORE presented by Haas = FRC 2027, kickoff 2027-01-09 12:00 ET.
# BIOBUZZ is the FTC sibling game and appears nowhere in this file.
#
# Evidence labels: C = confirmed in a primary source; H = historical pattern;
#                  S = speculation / model estimate; UNVERIFIED = could not be checked.

meta:
  title: Award alignment matrix for BIOCORE presented by Haas (FRC 2027)
  generated: 2026-08-22
  season: 2026-27 BIOCORE
  kickoff: 2027-01-09T12:00:00-05:00
  team_profile: ~15 students, limited budget, experienced mentor
  authority_for_award_names: reference/awards/awards.yaml
  sources:
    AV: reference/awards/00_AWARD_LIST_VERIFIED.md
    AY: reference/awards/awards.yaml
    AE: reference/awards/00_AWARD_LIST_EMPIRICAL_2026.md
    AP: reference/awards/01_AWARD_WINNING_PATTERNS.md
    AC: reference/03_ARCHETYPE_CORPUS.md
    ACY: reference/archetype_corpus.yaml
    CM: reference/02_TEAM_CAPACITY_MODEL.md
    CMS: tools/capacity_model.py
    PF: reference/04_PREDICTIVE_FACTORS.md
    # REB, JM and WB are not in the repository, because FIRST's text is not redistributed.
    # From the repository root, bash tools/rebuild-corpus.sh --fetch and then
    # bash tools/rebuild-corpus.sh rebuild them locally.
    REB: manuals/archive/frc/_txt/2026_REBUILT.txt
    JM: reference/awards/pdfs/judge-manual.pdf
    WB: reference/awards/pdfs/award-workbook.pdf
  governing_rule:
    quote: "Do not award the same team more than 1 judged award at a single event."
    source: JM
    evidence: C
    consequence: >
      The deliverable per archetype is exactly one PRIMARY and one SECONDARY lane,
      not a wishlist. Preparing five lanes splits one pit conversation five ways.

# ---------------------------------------------------------------------------
# 1. AWARD COLUMNS
# ---------------------------------------------------------------------------

awards_robot_coupled:
