# ---------------------------------------------------------------------------
# 8. THE DISTRICT-POINTS ARGUMENT
# ---------------------------------------------------------------------------

district_points_argument:
  source: REB section 11.1, Table 11-1 / Table 11-3 / Table 11-4
  evidence: C
  applies_to: District-model teams only. Regional teams advance via the points-based Regional Pool (AV section 5.2); the arithmetic does not transfer.
  table_11_1:
    qualification_round_performance: "Normal distribution of points from 22 to 4 across the highest ranked team to the lowest"
    alliance_captains: "17 minus the ALLIANCE CAPTAIN number (e.g. 14 points for ALLIANCE #3 Captain)"
    draft_order_acceptance: "17 minus the Draft Order Acceptance Number (e.g. 12 points for the team that accepts the fifth draft position)"
    playoff_advancement: {fourth_place: 7, third_place: 13, finalist: 20, winner: "20 + 5 per Finals win"}
    team_judged_awards: {first_impact: 10, engineering_inspiration: 8, rookie_all_star: 8, all_other_team_judged: 5}
    dcmp_multiplier: 3
  what_five_points_is_worth:
    one_other_team_judged_award: 5
    climb_rank_30_to_20_at_40_team_event: 4
    climb_rank_40_to_21_beating_half_the_field: 8
    drafted_at_slot_5: 12
    drafted_at_slot_5_plus_one_judged_award: 17
    first_in_qualification: 22
    entire_qualification_spread: 18
    headline: >
      One 5-point judged award is worth more than climbing ten qualification places.
      Being picked fifth is worth more than out-qualifying 19 of 39 opponents.
  scenarios:
    evidence: S
    note: Point VALUES are [C] verbatim from REB Table 11-1. The claim that section-4 nudges move a team from A to D is a judgement.
    conclusion: Scenario D is 3.7x Scenario A on the same robot.
    assumptions: Two District events, 40 teams each, identical robot in all four rows; only the award and pickability work differs.
    rows:
      - {id: A, description: "Field only, unpicked, no award, qual rank 28/40", qual: 9, alliance: 0, playoff: 0, award: 0, per_event: 9, two_events: 18}
      - {id: B, description: "Same robot, picked 12th overall (legibility)", qual: 9, alliance: 5, playoff: 0, award: 0, per_event: 14, two_events: 28}
      - {id: C, description: "B + one 5-point judged award", qual: 9, alliance: 5, playoff: 0, award: 5, per_event: 19, two_events: 38}
      - {id: D, description: "Picked 5th + award + alliance loses in the semis", qual: 9, alliance: 12, playoff: 7, award: 5, per_event: 33, two_events: 66}
  why_pickable_and_award_winning_are_the_same_investment:
    quote: >
      To be invited to join an ALLIANCE, a team's peers have decided that the team has
      attributes that are desirable. ... These points also have the potential to recognize
      teams employing a unique strategy with their ROBOT. Teams with unique or divergent
      ROBOT capabilities that complement the strengths of other ALLIANCE members may be
      selected to fill a strategic niche.
    source: REB section 11.1.2
    evidence: C
    supporting_base_rates:
      pct_2026_winning_alliances_with_below_median_opr_member: 78
      median_deepest_pick_opr_percentile_2026: 90
      source: AC section 1 (TBA, 765 event-winning alliances 2023-2026)
    conclusion: >
      The reliability tally (N07), failure log (N06), telemetry (N03) and rehearsed
      90-second explanation (N11) are simultaneously the judging evidence and the scouting
      pitch to alliance captains. One artifact set, two point streams, same currency.

# ---------------------------------------------------------------------------
# 9. VALIDATION
# ---------------------------------------------------------------------------

validation:
  tests:
  - id: V1
    test: Re-derive pairings from fit_matrix using the extraction_rule and assert equality with `pairings`
    script: AWARD-ALIGNMENT.md section 8.1
    result_2026_08_22: All 7 rows OK
  - id: V2
    test: Every award name used in AWARD-ALIGNMENT.md exists in awards.yaml
    script: AWARD-ALIGNMENT.md section 8.2
    result_2026_08_22: "No award name in the matrix, pairings or checklists is absent from awards.yaml. Expected residue: generic phrases + the Judges/Judges' spelling variance."
  - id: V3
    test: In-season calendar hours vs the capacity-derived budget
    script: AWARD-ALIGNMENT.md section 8.3
    result_2026_08_22: "calendar 58 h; Week-1 budget 46 h (1.26x over); Week-4 budget 73 h (0.79x). Real failure of the Week-1 plan."
  - id: V4
    test: Do the recommended PRIMARY awards actually go to low-ranked teams?
    result_2026_08_22:
      weighted_mean_pct_bottom_half_over_6_viable_rows: 22.8
      comparison_if_every_row_paired_to_autonomous: 4.9
      comparison_unweighted_mean_all_9_robot_coupled: 24.1
      finding: >
        The two rows carrying the highest base rates (I3 Judges 49.6%, I6 GP 41.2%) are also
        the two archetypes AC scores highest for small-team success (3/4 and 5/5). Two
        independent datasets agreeing is the strongest validation in this pass.
  not_covered:
    - Whether a judge agrees with a fit score. FIRST publishes no rubric.
    - The odds-lift bands in design_nudges. Only the ranking is claimed.
    - Whether section-4 nudges change draft position (district_points_argument scenarios B-D).

known_limitations:
  - reference/team_capacity.yaml does not exist on disk (UNVERIFIED). All capacity figures were regenerated by running tools/capacity_model.py on 2026-08-22.
  - Fit scores are [S]. The criteria quotes are [C]; the 0-3 mapping is judgement against fit_rubric. Two reasonable people would differ on perhaps 3 of the 56 robot-coupled cells.
  - All hour estimates are [S] and were not measured against this team's actual output.
  - Odds lifts are unmeasured bands. No dataset in this corpus links a specific practice to a specific award outcome.
  - Guideline wording is the 2026 text (WB Rev. Oct 2025, JM Rev 2 2/18/2026). [C] for 2026, [H] for 2027. Expect re-issued guides Oct-Dec 2026.
  - Award names may move again - a sponsor suffix moved in every season 2022-2026 and the individual-student award was renamed mid-season in 2026. Run kickoff_award_check.sh before printing anything.
  - The archetypes are pre-kickoff abstractions. If BIOCORE lacks an endgame, I4's pairing is void; if it has no support role, I6's is. Instantiate the invariant slots on 2027-01-09 FIRST, then read the pairings.
  - Systemcore is the largest single uncertainty. The 2027 logging API is UNVERIFIED, which puts the innovation_in_control checklist's central artifact at risk.
  - District-points scenarios B-D are [S]. The point values are [C] verbatim.
  - Nothing in the files, manuals or PDFs read for this pass contained text addressed to an AI assistant or any attempt to issue instructions. All content was treated as data.
