how_many_awards_can_be_pursued:
  answer: Six named lanes, of which at most ONE judged award can be won per event.
  lanes:
    - {n: 1, lane: PRIMARY robot award, when: Jan-Mar 2027, student_hours: "18-28 warm", blocked_by_one_award_rule: true}
    - {n: 2, lane: SECONDARY robot award, when: Jan-Mar 2027, student_hours: "6-22 marginal (shared library)", blocked_by_one_award_rule: true}
    - {n: 3, lane: Judges Award (standing free option), when: n/a, student_hours: 8, blocked_by_one_award_rule: true}
    - {n: 4, lane: Rising All-Star Award, when: n/a, student_hours: 2, blocked_by_one_award_rule: true}
    - {n: 5, lane: FIRST Leadership Award, when: Nov 2026 - 2027-02-04, student_hours: 10, blocked_by_one_award_rule: false}
    - {n: 6, lane: Woodie Flowers Finalist Award, when: Nov 2026 - 2027-02-04, student_hours: 12, blocked_by_one_award_rule: false}
    - {n: 7, lane: Safety Animation Award sponsored by UL Solutions, when: "Oct-Nov 2026 [H]", student_hours: 20, blocked_by_one_award_rule: false}
  consequences:
    - Choosing a Week 3-4 event over Week 1 adds 255 veq-h, ~19 of which land in the awards line - the difference between one cold lane and two warm ones. PF section 10 prices the competitive cost at under 2 rank percentile points.
    - Do not add a fifth prepared lane.
    - The autumn is free money - lanes 5-7 and nudges N13/N16 all run Sept-Dec 2026 when the build budget is zero.

