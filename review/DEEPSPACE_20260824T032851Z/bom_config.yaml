# bom_config.yaml -- 2019 DESTINATION: DEEP SPACE, end-to-end beta test.
name: "DEEP SPACE -- KOP chassis + hatch/cargo ground intake + telescoping lift (no climb)"
notes: >
  Rocket-level-1 and CARGO SHIP scoring only. One novel workstream (the combined
  hatch/cargo manipulator). HAB Level 1 rather than Level 3: L3 pays 12 vs 3 but the
  mechanism is a second workstream and 2019's L3 climbs were slow and failure-prone.

target:
  name: "ROCKET level-1 CARGO PORT"
  aperture_height_in: 39        # 3 ft 3-1/8 in to the top of the lowest PORT
  aperture_range_in: 12         # scored from contact range, not a standoff shot
  source: "manual s4.10 vision targets p35 -- lowest ROCKET PORT top = 3 ft 3-1/8 in (~99 cm)"

mechanisms:
  - kop_chassis
  - bumpers_frame
  - baseline_electrical_package
  - id: under_bumper_intake
    note: "combined hatch/cargo manipulator -- THE novel workstream"
  - id: telescoping_arm
    note: "lifts the hatch/cargo manipulator to the 39 in ROCKET level-1 PORT. Added after the
      GEOMETRY gate failed the first config: an over-bumper intake alone reaches 12 in and
      DEEP SPACE has NO low goal -- every scoring location is 31 in or higher."
